<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - Pondok Pemulihan Papua</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root { 
            --primary: #003366; --accent: #007bff; --dark: #333; 
            --light: #f4f7f6; --success: #28a745; --emas: #D4AF37;
            --danger: #dc3545; --purple: #6f42c1; --orange: #fd7e14; --cyan: #17a2b8;
            --teal: #008080;
        }

        body { font-family: 'Segoe UI', sans-serif; background: var(--light); margin: 0; padding: 15px; color: var(--dark); }
        .admin-container { max-width: 100%; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 25px rgba(0,0,0,0.1); }
        
        .header-section { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--emas); padding-bottom: 15px; margin-bottom: 25px; }
        .btn-logout { background: var(--danger); color: white; padding: 10px 18px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 13px; transition: 0.3s; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stats-grid a { text-decoration: none; }
        .stat-card { padding: 20px; border-radius: 12px; color: white; position: relative; overflow: hidden; transition: 0.3s; display: flex; align-items: center; min-height: 80px; }
        .stat-card h4 { margin: 0; font-size: 12px; text-transform: uppercase; z-index: 2; position: relative; }
        .stat-card i { position: absolute; right: 15px; font-size: 2rem; opacity: 0.2; z-index: 1; }

        #actionMenu { display: none; gap: 10px; margin-bottom: 15px; padding: 15px; background: #fff3cd; border: 1px solid #ffeeba; border-radius: 10px; align-items: center; }

        .table-controls { display: flex; gap: 15px; margin-bottom: 20px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
        
        .search-container { position: relative; flex: 1; min-width: 300px; display: flex; align-items: center; }
        .search-container input { width: 100%; padding: 12px 20px 12px 45px; border: 2px solid #eee; border-radius: 12px; font-size: 14px; outline: none; transition: 0.3s; }
        .search-container input:focus { border-color: var(--accent); box-shadow: 0 0 8px rgba(0,123,255,0.1); }
        .search-container i { position: absolute; left: 18px; color: #aaa; font-size: 16px; }

        .btn-cetak-kartu-main { background: var(--teal); color: white; border: none; padding: 12px 25px; border-radius: 12px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.3s; }
        .btn-cetak-kartu-main:hover { background: #006666; transform: translateY(-2px); }

        .table-responsive { overflow-x: auto; border-radius: 12px; border: 1px solid #eee; }
        table { width: 100%; border-collapse: collapse; min-width: 1500px; }
        table th { background: var(--primary); color: white; padding: 15px; font-size: 12px; text-align: left; }
        table td { padding: 12px 15px; border-bottom: 1px solid #f8f9fa; font-size: 13px; color: #555; }
        
        .nij-col { color: var(--accent); font-weight: bold; font-family: 'Courier New', monospace; }
        .badge-aktif { background: #d4edda; color: #155724; padding: 5px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; }
        .badge-pending { background: #ffefc1; color: #856404; padding: 5px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; }
        
        .btn-action { padding: 8px; border: none; border-radius: 6px; color: white; cursor: pointer; margin-right: 5px; }

        /* --- CSS KARTU DIGITAL POPUP --- */
        .modal-card-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 10000; justify-content: center; align-items: center; padding: 20px;
        }
        .digital-card-box {
            width: 380px; height: 230px; background: linear-gradient(135deg, #f1c40f 0%, #d4af37 50%, #b8860b 100%);
            border-radius: 15px; position: relative; padding: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            color: #fff; font-family: 'Arial', sans-serif; border: 1px solid rgba(255,255,255,0.4); overflow: hidden;
        }
        .card-logo-right { position: absolute; top: 15px; right: 15px; width: 55px; height: 55px; object-fit: contain; }
        .card-header-title { font-size: 13px; font-weight: 800; color: #003366; margin-bottom: 20px; text-transform: uppercase; }
        .card-data-row { margin-bottom: 8px; }
        .card-data-label { font-size: 8px; opacity: 0.9; text-transform: uppercase; color: #fdfdfd; }
        .card-data-value { font-size: 13px; font-weight: bold; text-shadow: 1px 1px 2px rgba(0,0,0,0.3); text-transform: uppercase; }
        .card-nij-atm {
            position: absolute; bottom: 25px; left: 20px; font-family: 'Courier New', Courier, monospace;
            font-size: 22px; font-weight: bold; letter-spacing: 2px; text-shadow: 2px 2px 3px rgba(0,0,0,0.6);
        }
        .card-qrcode-box { position: absolute; bottom: 15px; right: 20px; background: white; padding: 4px; border-radius: 5px; }
        .btn-close-card { position: absolute; top: -40px; right: 0; color: white; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

<div class="admin-container">
    <div class="header-section">
        <div>
            <h2 style="color:var(--primary); margin:0;">Dashboard Administrator</h2>
            <small style="color: #666;">Manajemen Data Jemaat Real-time</small>
        </div>
        <div style="display: flex; gap: 15px; align-items: center;">
            <div onclick="bukaKartuDigitalDinamis()" style="cursor:pointer; color: var(--emas); font-size: 24px;" title="Cek Kartu Digital">
                <i class="fas fa-id-card"></i>
            </div>
            <button type="button" class="btn-logout" onclick="logoutAdmin()"><i class="fas fa-sign-out-alt"></i> KELUAR SISTEM</button>
        </div>
    </div>

    <div class="stats-grid">
        <a href="admin-tiket.html"><div class="stat-card" style="background: var(--accent);"><h4>Portal Tiket</h4><i class="fas fa-ticket-alt"></i></div></a>
        <a href="database-jemaat.html"><div class="stat-card" style="background: var(--success);"><h4>DATA BASE JEMAAT</h4><i class="fas fa-users"></i></div></a>
        <a href="portal-media.html"><div class="stat-card" style="background: var(--purple);"><h4>Portal Media</h4><i class="fas fa-icons"></i></div></a>
        <a href="informasi-kegiatan.html"><div class="stat-card" style="background: var(--orange);"><h4>Info Kegiatan</h4><i class="fas fa-calendar-alt"></i></div></a>
        <a href="admin-bigdata.html"><div class="stat-card" style="background: var(--cyan);"><h4>Big Data</h4><i class="fas fa-chart-line"></i></div></a>
        <a href="admin-news.html"><div class="stat-card" style="background: var(--primary);"><h4>News SIPAPUA</h4><i class="fas fa-newspaper"></i></div></a>
        <a href="admin-popup.html"><div class="stat-card" style="background: var(--purple);"><h4>Popup Banner</h4><i class="fas fa-bullhorn"></i></div></a>
        <a href="manajemen-user.html"><div class="stat-card" style="background: var(--emas); color: #333;"><h4 style="color: #333;">Manajemen User</h4><i class="fas fa-users-cog" style="color: #333;"></i></div></a>
    </div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDU2rk0rIF-sos_Sj7C5IMM9dU8z8p_VJM",
        authDomain: "boby-apps-project.firebaseapp.com",
        projectId: "boby-apps-project",
        storageBucket: "boby-apps-project.appspot.com",
        messagingSenderId: "125984859692",
        appId: "1:125984859692:web:09f75df5d2e4b6e3bcd389"
    };

    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }

    const auth = firebase.auth();
    const db = firebase.firestore();

const MASTER_UID = "hXo6v5OKhkMVtRAAuUqcYcASplo2";
    const ADMIN_ROLES = new Set(["master", "super_admin", "admin", "viewer"]);
    const IDLE_TIMEOUT_MS = 30 * 60 * 1000;
    const IDLE_WARNING_MS = 29 * 60 * 1000;

    let idleTimeoutId = null;
    let idleWarningId = null;
    let sessionWarningEl = null;

    function hideSessionWarning() {
        if (sessionWarningEl) {
            sessionWarningEl.remove();
            sessionWarningEl = null;
        }
    }

    function showSessionWarning() {
        hideSessionWarning();

        sessionWarningEl = document.createElement("div");
        sessionWarningEl.id = "adminSessionWarning";
        sessionWarningEl.style.cssText = [
            "position:fixed",
            "top:20px",
            "right:20px",
            "z-index:99999",
            "max-width:360px",
            "padding:16px 18px",
            "background:#fff3cd",
            "color:#664d03",
            "border:1px solid #ffecb5",
            "border-radius:10px",
            "box-shadow:0 8px 24px rgba(0,0,0,.18)",
            "font-family:Segoe UI,sans-serif",
            "font-size:14px",
            "line-height:1.5"
        ].join(";");

        sessionWarningEl.innerHTML =
            "<strong>Sesi Admin</strong><br>" +
            "Sesi akan berakhir karena tidak ada aktivitas. " +
            "Lakukan aktivitas untuk melanjutkan sesi.";

        document.body.appendChild(sessionWarningEl);
    }

    function clearIdleTimers() {
        if (idleTimeoutId) {
            clearTimeout(idleTimeoutId);
            idleTimeoutId = null;
        }

        if (idleWarningId) {
            clearTimeout(idleWarningId);
            idleWarningId = null;
        }
    }

    function resetIdleTimer() {
        if (!auth.currentUser) {
            return;
        }

        clearIdleTimers();
        hideSessionWarning();

        idleWarningId = setTimeout(() => {
            if (auth.currentUser) {
                showSessionWarning();
            }
        }, IDLE_WARNING_MS);

        idleTimeoutId = setTimeout(async () => {
            if (!auth.currentUser) {
                return;
            }

            try {
                await auth.signOut();
            } catch (error) {
                console.error("Idle session sign-out error:", error);
            } finally {
                hideSessionWarning();
                window.location.replace("login_cyber.html");
            }
        }, IDLE_TIMEOUT_MS);
    }

    function registerIdleActivity() {
        resetIdleTimer();
    }

    ["click", "mousedown", "keydown", "scroll", "touchstart", "mousemove"].forEach((eventName) => {
        window.addEventListener(eventName, registerIdleActivity, {passive: true});
    });

    auth.onAuthStateChanged(async (user) => {
        if (!user) {
            window.location.replace("login_cyber.html");
            return;
        }

        try {
            const adminDoc = await db.collection("admin_users")
                .doc(user.uid)
                .get();

            if (!adminDoc.exists) {
                throw new Error("ADMIN_NOT_REGISTERED");
            }

            const adminData = adminDoc.data();
            const role = adminData.role || "";
            const status = adminData.status || "inactive";

            if (!ADMIN_ROLES.has(role)) {
                throw new Error("ADMIN_NOT_AUTHORIZED");
            }

            if (status !== "active") {
                throw new Error("ADMIN_INACTIVE");
            }

            if (user.uid === MASTER_UID) {
                if (role !== "master" || adminData.protected !== true) {
                    throw new Error("MASTER_PROTECTION_INVALID");
                }
            }

            // Database Jemaat dipisahkan ke database-jemaat.html.
            resetIdleTimer();
        } catch (error) {
            console.error("Admin dashboard authorization error:", error);

            try {
                await auth.signOut();
            } catch (signOutError) {
                console.error("Authorization sign-out error:", signOutError);
            }

            window.location.replace("login_cyber.html");
        }
    });


    async function logoutAdmin() {
        try {
            await auth.signOut();
            window.location.replace("login_cyber.html");
        } catch (error) {
            console.error("Logout error:", error);
            alert("Gagal keluar dari sistem. Silakan coba lagi.");
        }
    }

</script>
</body>
</html>
