<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Call Center - SIPAPUA</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --biru-tua: #003366;
            --biru-hover: #002244;
            --emas: #D4AF37;
            --putih: #ffffff;
            --bg: #f0f2f5;
            --text: #333333;
            --muted: #666666;
            --border: #dddddd;
            --success: #28a745;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 20px;
            color: var(--text);
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 460px;
            margin: 0 auto;
            background: var(--putih);
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.10);
            border-top: 5px solid var(--emas);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header-icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 10px;
            border-radius: 50%;
            background: var(--biru-tua);
            color: var(--emas);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        h2 {
            color: var(--biru-tua);
            margin: 0;
            font-size: 22px;
            text-transform: uppercase;
        }

        .subtitle {
            color: var(--muted);
            font-size: 13px;
            margin-top: 6px;
        }

        .user-box {
            background: #f8f9fa;
            padding: 14px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .user-box div {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 5px;
        }

        .user-box div:last-child {
            margin-bottom: 0;
        }

        .user-box b {
            color: var(--biru-tua);
        }

        .service-label {
            display: block;
            color: var(--biru-tua);
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .service-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 18px;
        }

        .service-btn {
            border: 1px solid #d9d9d9;
            background: #fff;
            border-radius: 14px;
            padding: 14px 10px;
            cursor: pointer;
            color: var(--biru-tua);
            font-weight: 600;
            font-size: 12px;
            min-height: 75px;
            transition: 0.2s ease;
        }

        .service-btn i {
            display: block;
            font-size: 22px;
            margin-bottom: 7px;
            color: var(--emas);
        }

        .service-btn:hover {
            border-color: var(--emas);
            transform: translateY(-2px);
        }

        .service-btn.active {
            background: var(--biru-tua);
            color: #fff;
            border-color: var(--biru-tua);
        }

        .service-btn.active i {
            color: var(--emas);
        }

        textarea {
            width: 100%;
            min-height: 150px;
            resize: vertical;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            background: #fafafa;
        }

        textarea:focus {
            border-color: var(--biru-tua);
            background: #fff;
        }

        .btn-kirim {
            width: 100%;
            margin-top: 15px;
            background: var(--biru-tua);
            color: #fff;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .btn-kirim:hover {
            background: var(--biru-hover);
        }

        .btn-kirim:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        .btn-back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #888;
            text-decoration: none;
            font-size: 13px;
        }

        .btn-back:hover {
            color: var(--biru-tua);
        }

        #success-screen {
            display: none;
            text-align: center;
        }

        .icon-check {
            font-size: 55px;
            color: var(--success);
            margin-bottom: 15px;
        }

        .ticket-display {
            background: #f8f9fa;
            padding: 18px;
            border-radius: 15px;
            margin: 20px 0;
            border: 2px dashed var(--emas);
        }

        .ticket-number {
            font-size: 22px;
            color: var(--biru-tua);
            font-weight: bold;
            letter-spacing: 1px;
        }

        .note {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.5;
        }

        @media (max-width: 420px) {
            body {
                padding: 12px;
            }

            .container {
                padding: 20px 16px;
                border-radius: 20px;
            }

            .service-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div id="form-screen">

        <div class="header">
            <div class="header-icon">
                <i class="fa-solid fa-headset"></i>
            </div>

            <h2>CALL CENTER</h2>

            <div class="subtitle">
                Layanan bantuan dan pelayanan SIPAPUA
            </div>
        </div>

        <div class="user-box">
            <div>
                Pengirim:
                <b id="txt-nama">Memuat...</b>
            </div>

            <div>
                Komsel:
                <b id="txt-komsel">Memuat...</b>
            </div>
        </div>

        <label class="service-label">
            Pilih Layanan
        </label>

        <div class="service-grid">

            <button type="button"
                    class="service-btn active"
                    data-kategori="Call Operator"
                    onclick="pilihLayanan(this)">
                <i class="fa-solid fa-phone-volume"></i>
                Call Operator
            </button>

            <button type="button"
                    class="service-btn"
                    data-kategori="Kritik dan Saran"
                    onclick="pilihLayanan(this)">
                <i class="fa-solid fa-comments"></i>
                Kritik dan Saran
            </button>

            <button type="button"
                    class="service-btn"
                    data-kategori="Permohonan Doa"
                    onclick="pilihLayanan(this)">
                <i class="fa-solid fa-hands-praying"></i>
                Permohonan Doa
            </button>

            <button type="button"
                    class="service-btn"
                    data-kategori="Appointment"
                    onclick="pilihLayanan(this)">
                <i class="fa-solid fa-calendar-check"></i>
                Appointment
            </button>

            <button type="button"
                    class="service-btn"
                    data-kategori="Pelayanan Pastoral"
                    onclick="pilihLayanan(this)">
                <i class="fa-solid fa-people-arrows"></i>
                Pelayanan Pastoral
            </button>

            <button type="button"
                    class="service-btn"
                    data-kategori="Gangguan Aplikasi"
                    onclick="pilihLayanan(this)">
                <i class="fa-solid fa-triangle-exclamation"></i>
                Gangguan Aplikasi
            </button>

        </div>

        <label class="service-label" for="pesan-tiket">
            Pesan / Permohonan
        </label>

        <textarea
            id="pesan-tiket"
            placeholder="Tuliskan pesan, kebutuhan, atau permohonan Anda..."></textarea>

        <button
            type="button"
            class="btn-kirim"
            id="btn-submit"
            onclick="kirimTiket()">

            <i class="fa-solid fa-paper-plane"></i>
            KIRIM PERMOHONAN
        </button>

        <a href="menu.html" class="btn-back">
            <i class="fa-solid fa-chevron-left"></i>
            Kembali ke Menu
        </a>

    </div>


    <div id="success-screen">

        <i class="fa-solid fa-circle-check icon-check"></i>

        <h2 style="color: var(--biru-tua);">
            Permohonan Terkirim
        </h2>

        <div class="ticket-display">

            <div style="font-size:12px;color:#666;">
                Nomor Tiket Anda
            </div>

            <div
                id="display-nomor-tiket"
                class="ticket-number">
                -
            </div>

        </div>

        <p class="note">
            Permohonan Anda telah diterima oleh
            Call Center SIPAPUA dan akan diproses
            oleh operator.
        </p>

        <a href="menu.html" class="btn-back">
            <i class="fa-solid fa-house"></i>
            Kembali ke Menu
        </a>

    </div>

</div>


<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script>

const firebaseConfig = {
    apiKey: "AIzaSyDU2rk0rIF-sos_Sj7C5IMM9dU8z8p_VJM",
    authDomain: "boby-apps-project.firebaseapp.com",
    projectId: "boby-apps-project",
    storageBucket: "boby-apps-project.appspot.com",
    messagingSenderId: "125984859692",
    appId: "1:125984859692:web:09f75df5d2e4b6e3bcd389"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();
const auth = firebase.auth();

let callCenterUser = null;

let kategoriTerpilih = "Call Operator";


function pilihLayanan(button) {

    document
        .querySelectorAll(".service-btn")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    kategoriTerpilih = button.dataset.kategori;
}


auth.onAuthStateChanged(async function(user) {

    if (!user) {
        callCenterUser = null;
        localStorage.removeItem("userEmail");
        localStorage.removeItem("userUid");
        window.location.replace("index.html");
        return;
    }

    callCenterUser = user;

    if (user.email) {
        localStorage.setItem("userEmail", user.email);
    }

    localStorage.setItem("userUid", user.uid);

    try {
        const snap = await db
            .collection("users")
            .where("email", "==", user.email)
            .get();

        if (!snap.empty) {
            const userData = snap.docs[0].data();

            document.getElementById("txt-nama").innerText =
                userData.nama || "-";

            document.getElementById("txt-komsel").innerText =
                "JC " + (userData.komsel || "Pusat");
        } else {
            document.getElementById("txt-nama").innerText =
                "Tidak tersedia";

            document.getElementById("txt-komsel").innerText =
                "-";
        }

    } catch (error) {
        console.error("Gagal memuat data pengguna:", error);

        document.getElementById("txt-nama").innerText =
            "Tidak tersedia";

        document.getElementById("txt-komsel").innerText =
            "-";
    }
});


async function kirimTiket() {

    const pesan =
        document.getElementById("pesan-tiket").value.trim();

    const btn =
        document.getElementById("btn-submit");

    const email =
        callCenterUser && callCenterUser.email
            ? callCenterUser.email
            : "";

    if (!email) {
        alert("Sesi login tidak tersedia. Silakan login kembali.");
        return;
    }

    const nama =
        document.getElementById("txt-nama").innerText;

    const komsel =
        document.getElementById("txt-komsel").innerText;


    if (!pesan || nama === "Memuat...") {

        alert(
            "Mohon tuliskan pesan atau permohonan Anda."
        );

        return;
    }


    btn.disabled = true;

    btn.innerHTML =
        "<i class='fa-solid fa-spinner fa-spin'></i> Mengirim...";


    try {

        const now = new Date();

        const tahun =
            now.getFullYear();

        const hariNama =
            now.toLocaleDateString(
                "id-ID",
                { weekday: "long" }
            );

        const tglLengkap =
            now.toLocaleDateString(
                "id-ID",
                {
                    day: "numeric",
                    month: "long",
                    year: "numeric"
                }
            );

        const jamLengkap =
            now.toLocaleTimeString(
                "id-ID",
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );


        const randomNum =
            Math.floor(
                100 +
                Math.random() * 900
            );

        const nomorTiket =
            `CALL-${randomNum}-${tahun}`;


        await db
            .collection("saran_masukan")
            .add({

                nomor_tiket: nomorTiket,

                nama: nama,

                email: email,

                jc: komsel,

                kategori: kategoriTerpilih,

                isi_saran: pesan,

                status: "proses",

                timestamp:
                    firebase.firestore.FieldValue
                        .serverTimestamp(),

                tanggal_kirim:
                    `${hariNama}, ${tglLengkap}`,

                jam_kirim:
                    jamLengkap,

                sla_days: 0
            });


        document
            .getElementById("display-nomor-tiket")
            .innerText = nomorTiket;


        document
            .getElementById("form-screen")
            .style.display = "none";


        document
            .getElementById("success-screen")
            .style.display = "block";


    } catch (error) {

        console.error(
            "Gagal mengirim tiket:",
            error
        );

        alert(
            "Permohonan gagal dikirim. " +
            "Silakan coba kembali."
        );

        btn.disabled = false;

        btn.innerHTML =
            "<i class='fa-solid fa-paper-plane'></i> " +
            "KIRIM PERMOHONAN";
    }

}

</script>

</body>
</html>
