<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Leaderboard — Dalam Pengerjaan</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow-x: hidden; }

    body {
      min-height: 100vh;          /* cadangan untuk browser lama */
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: radial-gradient(circle at 50% 20%, #a3246d 0%, #5a0c38 55%, #3a0624 100%);
    }

    main {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    /* Lebar = yang PALING KECIL antara lebar layar & (tinggi layar × 9/16) */
    .tiktok-frame {
      width: min(100vw - 32px, (100vh - 32px) * 9 / 16, 540px);
      width: min(100vw - 32px, (100dvh - 32px) * 9 / 16, 540px);
      aspect-ratio: 9 / 16;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 24px 60px -20px rgba(0,0,0,.6), 0 0 0 2px rgba(240,196,80,.35);
    }

    .tiktok-frame img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* HP: tanpa jarak tepi & tanpa bingkai, tetap utuh */
    @media (max-width: 600px) {
      body { padding: 0; }
      .tiktok-frame {
        width: min(100vw, 100vh * 9 / 16);
        width: min(100vw, 100dvh * 9 / 16);
        border-radius: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="tiktok-frame">
      <img src="leaderboard-tiktok-540x960.webp"
           width="540" height="960"
           alt="Leaderboard SIPAPUA sedang dalam pengerjaan">
    </div>
  </main>
</body>
</html>
