<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Leaderboard — Dalam Pengerjaan</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0; min-height: 100dvh; padding: 16px;
      display: grid; place-items: center;
      background: radial-gradient(circle at 50% 20%, #a3246d 0%, #5a0c38 55%, #3a0624 100%);
    }
    .tiktok-frame {
      aspect-ratio: 9 / 16;
      height: calc(100dvh - 32px);   /* selalu muat satu layar */
      max-height: 960px;             /* tidak melebihi resolusi asli */
      max-width: 100%;
      border-radius: 22px; overflow: hidden;
      box-shadow: 0 24px 60px -20px rgba(0,0,0,.6), 0 0 0 2px rgba(240,196,80,.35);
    }
    .tiktok-frame img { display: block; width: 100%; height: 100%; object-fit: contain; }

    /* HP portrait: layar penuh tanpa bingkai */
    @media (max-width: 600px) and (orientation: portrait) {
      body { padding: 0; }
      .tiktok-frame { height: 100dvh; max-height: none; width: 100%; border-radius: 0; box-shadow: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="tiktok-frame">
      <img src="leaderboard-tiktok-540x960.webp"
           width="540" height="960"
           alt="Leaderboard SIPAPUA sedang dalam pengerjaan">
    </div>
  </main>
</body>
</html>
