<!DOCTYPE html>
<html>
<head>
    <title>Verifikasi Berhasil</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #f4f7f6; }
        .card { background: white; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 20px; display: inline-block; max-width: 400px; }
        .btn { display: inline-block; margin-top: 15px; padding: 10px 20px; background: #6f42c1; color: white; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="card">
        <h1 id="status-title">Memproses Verifikasi...</h1>
        <p id="status-desc">Mohon tunggu sebentar sementara kami memverifikasi akun Anda.</p>
        <a href="index.html" class="btn">Kembali ke Login</a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-functions-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-check-compat.js"></script>
<script src="sipapua-app-check.js"></script>
<script src="sipapua-spark-member.js"></script>
<script src="sipapua-member-session.js"></script>
<script src="sipapua-login.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDU2rk0rIF-sos_Sj7C5IMM9dU8z8p_VJM",
            authDomain: "boby-apps-project.firebaseapp.com",
            projectId: "boby-apps-project",
            appId: "1:125984859692:web:09f75df5d2e4b6e3bcd389"
        };
        firebase.initializeApp(firebaseConfig);

        const urlParams = new URLSearchParams(window.location.search);
        const actionCode = urlParams.get('oobCode');

        if (actionCode) {
            firebase.auth().applyActionCode(actionCode).then(async () => {
                document.getElementById('status-title').innerText = "✅ Verifikasi Berhasil!";
                document.getElementById('status-desc').innerText = "Email Anda telah diverifikasi. Masuk untuk pemeriksaan aktivasi oleh server.";
                history.replaceState(null, "", location.pathname);
                try {
                    const user = await new Promise(resolve => { let off; off = firebase.auth().onAuthStateChanged(u => { if (off) off(); resolve(u); }); });
                    if (user) {
                        const login = window.SIPAPUA_LOGIN.create(firebase.auth(), window.SIPAPUA_MEMBER_SESSION.create(firebase));
                        const status = await login.status(user);
                        document.getElementById("status-desc").innerText = status.active ? "Email terverifikasi dan aktivasi dikonfirmasi server." : "Email terverifikasi. Akun belum diaktifkan; silakan hubungi pengurus.";
                    }
                } catch (_) { document.getElementById("status-desc").innerText = "Email terverifikasi. Masuk kembali untuk pemeriksaan aktivasi server."; }
            }).catch(error => {
                document.getElementById('status-title').innerText = "❌ Verifikasi Gagal";
                document.getElementById('status-desc').innerText = "Link sudah kadaluwarsa atau tidak valid: " + error.message;
            });
        }
    </script>
</body>
</html>
