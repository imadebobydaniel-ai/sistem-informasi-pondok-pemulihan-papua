<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UMKM Jemaat — Dalam Pengerjaan</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      overflow-x: hidden;          /* halaman tidak bisa digeser ke samping */
      background: #f4a81d;         /* kuning-jingga, menyatu dengan gambar */
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    main {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;             /* tidak pernah lebih lebar dari layar */
      max-height: 100vh;           /* tidak pernah lebih tinggi dari layar */
      max-height: 100dvh;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <main>
    <img src="umkm-sipapua-kuning-540x960.webp"
         width="540" height="960"
         alt="UMKM Jemaat SIPAPUA sedang dalam pengerjaan">
  </main>
</body>
</html>
