<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Cetak Kartu Jemaat - Pondok Pemulihan Papua</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script> 
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background: #333; display: flex; flex-direction: column; align-items: center; padding: 20px; font-family: 'Arial', sans-serif; }
        #cardContainer { display: flex; flex-wrap: wrap; gap: 40px; justify-content: center; margin-bottom: 100px; }
        
        .card-wrapper { display: flex; flex-direction: column; align-items: center; gap: 15px; }

        /* UKURAN STANDAR KARTU ATM (85.6mm x 54mm) disesuaikan ke px */
        .card { 
            width: 480px; height: 305px; background: white; border-radius: 12px; 
            position: relative; overflow: hidden; border: 1px solid #999;
            background-image: linear-gradient(to bottom right, #ffffff, #f0f7ff);
        }

        .btn-edit-trigger {
            position: absolute; top: 10px; right: 10px; z-index: 10;
            background: rgba(212, 175, 55, 0.9); color: white; border: none;
            border-radius: 5px; padding: 6px 10px; cursor: pointer;
        }

        .card-header { 
            background: #003366; color: white; padding: 5px 15px; 
            display: flex; align-items: center; justify-content: space-between;
            border-top: 4px solid #D4AF37; border-bottom: 8px solid #D4AF37; height: 75px;
        }

        /* PERBAIKAN LOGO AGAR TIDAK GEPENG */
        .header-logo { 
            width: 70px; 
            height: 70px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .header-logo img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        .header-text { text-align: center; flex: 1; }
        .header-text h2 { margin: 0; font-size: 16px; letter-spacing: 1px; font-weight: 800; }
        .header-text p { margin: 2px 0 0 0; font-size: 11px; color: #D4AF37; font-weight: bold; }

        .card-body { padding: 12px 15px; display: flex; gap: 15px; align-items: flex-start; }
        .photo-frame { width: 115px; height: 135px; border: 2px solid #003366; object-fit: cover; border-radius: 5px; background: #fff; }
        
        .right-side { flex: 1; display: flex; flex-direction: column; gap: 3px; }
        .info-row { display: flex; font-size: 10.5px; border-bottom: 1px solid #eee; padding-bottom: 1px; }
        .label { width: 80px; font-weight: bold; color: #003366; }
        .value { flex: 1; color: #333; text-transform: uppercase; font-weight: 600; }

        .barcode-container { width: 180px; height: 35px; border: 1px solid #ccc; align-self: flex-end; margin-top: 5px; background: white; }
        .card-footer { position: absolute; bottom: 0; width: 100%; background: #003366; color: white; font-size: 10px; text-align: center; padding: 4px 0; }

        .footer-controls { display: none; gap: 10px; width: 100%; }
        .btn-footer { flex: 1; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-save-db { background: #28a745; color: white; }
        .btn-cancel-db { background: #dc3545; color: white; }

        /* Modal Editor */
        .modal-overlay {
    position:fixed;
    inset:0;
    z-index:9999;
    display:none;
    align-items:flex-start;
    justify-content:center;
    padding:16px;
    box-sizing:border-box;
    overflow-y:auto;
    background:rgba(0,0,0,.72);
}
        .modal-box {
    width:min(460px, 100%);
    max-height:calc(100vh - 32px);
    overflow-y:auto;
    box-sizing:border-box;
    margin:auto;
    padding:18px;
    background:#fff;
    border-radius:12px;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
}
        .modal-box label { font-size: 12px; font-weight: bold; color: #444; }
        .modal-box input { width: 100%; padding: 8px; margin: 5px 0 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn-ok { background: #003366; color: white; width: 100%; padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }

        /* Floating Action Bar */
        .action-bar { position: fixed; bottom: 20px; right: 20px; z-index: 99; display: flex; gap: 10px; }
        .btn-main { border: none; padding: 15px 25px; border-radius: 50px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.4); display: flex; align-items: center; gap: 8px; }
        .btn-print { background: #007bff; color: white; }
        .btn-download-all { background: #ffc107; color: #333; }

        @media print { .action-bar, .btn-edit-trigger, .footer-controls { display: none !important; } body { background: white; } }
            .photo-placeholder {
            display:flex;
            align-items:center;
            justify-content:center;
            box-sizing:border-box;
            width:115px;
            height:140px;
            border:1px solid #9aa7b4;
            background:#eef3f7;
            color:#7b8794;
            font-size:11px;
            font-weight:700;
            letter-spacing:1px;
            text-align:center;
        }
        .modal-box .btn-footer {
            min-height:40px;
            border:0;
            border-radius:7px;
            cursor:pointer;
            font-weight:700;
        }

        .modal-box .btn-footer:disabled {
            opacity:.7;
            cursor:wait;
        }

        #editFotoPreview {
            flex-shrink:0;
        }</style>
</head>
<body>

<div class="action-bar">
    <button class="btn-main btn-download-all" onclick="downloadAllCards()"><i class="fas fa-file-image"></i> DOWNLOAD (JPG)</button>
    <button class="btn-main btn-print" onclick="window.print()"><i class="fas fa-print"></i> PRINT KARTU</button>
</div>

<div id="cardContainer"></div>

<div id="editModal" class="modal-overlay">
    <div class="modal-box">

        <h3 style="margin-top:0;">
            <i class="fas fa-edit"></i>
            Editor Kartu
        </h3>

        <input type="hidden" id="editCardId">

        <label>NIJ (Terkunci)</label>
        <input
            type="text"
            id="editNIJ"
            readonly
            style="background:#f0f0f0;"
        >

        <label>Nama Lengkap</label>
        <input type="text" id="editNama">

        <label>TTL</label>
        <input type="text" id="editTTL">

        <label>Alamat</label>
        <input type="text" id="editAlamat">

        <label>Jabatan</label>
        <input type="text" id="editJabatan">

        <label>Jemaat</label>
        <input type="text" id="editJemaat">

        <label>Komsel</label>
        <input type="text" id="editKomsel">

        <label>Foto Profil</label>

        <input
            type="file"
            id="editFoto"
            accept=".png,.jpg,.jpeg,.webp,image/png,image/jpeg,image/webp"
            onchange="previewEditorPhoto(this)"
            style="
                width:100%;
                box-sizing:border-box;
                margin-bottom:8px;
            "
        >

        <div
            id="editFotoPreview"
            style="
                width:115px;
                height:140px;
                margin:10px auto 12px;
                border:1px solid #b8c2cc;
                border-radius:4px;
                background:#eef3f7;
                display:flex;
                align-items:center;
                justify-content:center;
                overflow:hidden;
                color:#7b8794;
                font-size:11px;
                font-weight:700;
            "
        >
            FOTO
        </div>

        <div style="
            display:flex;
            gap:8px;
            margin-top:10px;
        ">
            <button
                type="button"
                class="btn-footer btn-cancel-db"
                onclick="cancelEditorPhoto()"
                style="flex:1;"
            >
                <i class="fas fa-times"></i>
                BATAL
            </button>

            <button
                type="button"
                class="btn-footer btn-save-db"
                onclick="saveEditorChanges()"
                style="flex:1;"
            >
                <i class="fas fa-save"></i>
                SIMPAN
            </button>
        </div>

    </div>
</div>
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDU2rk0rIF-sos_Sj7C5IMM9dU8z8p_VJM",
        authDomain: "boby-apps-project.firebaseapp.com",
        projectId: "boby-apps-project",
        storageBucket: "boby-apps-project.appspot.com",
        appId: "1:125984859692:web:09f75df5d2e4b6e3bcd389"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const originalDataStore = {};

    function previewEditorPhoto(input) {
        const file =
            input?.files?.[0];

        const preview =
            document.getElementById(
                "editFotoPreview"
            );

        if (!preview) {
            return;
        }

        if (!file) {
            preview.innerHTML =
                "FOTO";
            return;
        }

        const allowedTypes = [
            "image/png",
            "image/jpeg",
            "image/webp"
        ];

        if (!allowedTypes.includes(file.type)) {
            alert(
                "Format foto harus PNG, JPG, JPEG, atau WEBP."
            );

            input.value = "";
            preview.innerHTML =
                "FOTO";

            return;
        }

        const reader =
            new FileReader();

        reader.onload =
            function(event) {
                preview.innerHTML = `
                    <img
                        src="${event.target.result}"
                        alt="Preview Foto"
                        style="
                            width:100%;
                            height:100%;
                            object-fit:cover;
                            display:block;
                        "
                    >
                `;
            };

        reader.readAsDataURL(file);
    }

    async function processEditorPhoto(
        file
    ) {
        if (!file) {
            return "";
        }

        const allowedTypes = [
            "image/png",
            "image/jpeg",
            "image/webp"
        ];

        if (!allowedTypes.includes(file.type)) {
            throw new Error(
                "Format foto harus PNG, JPG, JPEG, atau WEBP."
            );
        }

        const reader =
            new FileReader();

        const dataUrl =
            await new Promise(
                (resolve, reject) => {
                    reader.onload =
                        () =>
                            resolve(
                                reader.result
                            );

                    reader.onerror =
                        () =>
                            reject(
                                new Error(
                                    "Gagal membaca foto."
                                )
                            );

                    reader.readAsDataURL(
                        file
                    );
                }
            );

        const img =
            new Image();

        await new Promise(
            (resolve, reject) => {
                img.onload = resolve;

                img.onerror =
                    () =>
                        reject(
                            new Error(
                                "Foto tidak dapat diproses."
                            )
                        );

                img.src = dataUrl;
            }
        );

        let width =
            img.width;

        let height =
            img.height;

        const maxSize = 400;

        if (
            width > maxSize ||
            height > maxSize
        ) {
            const scale =
                Math.min(
                    maxSize / width,
                    maxSize / height
                );

            width =
                Math.round(
                    width * scale
                );

            height =
                Math.round(
                    height * scale
                );
        }

        const canvas =
            document.createElement(
                "canvas"
            );

        canvas.width = width;
        canvas.height = height;

        const ctx =
            canvas.getContext(
                "2d"
            );

        if (!ctx) {
            throw new Error(
                "Browser tidak mendukung pemrosesan foto."
            );
        }

        ctx.drawImage(
            img,
            0,
            0,
            width,
            height
        );

        return canvas.toDataURL(
            "image/jpeg",
            0.8
        );
    }

    async function openEditor(id) {
        document.getElementById("editCardId").value = id;

        document.getElementById("editNIJ").value =
            document.getElementById(`v-nij-${id}`)
                .innerText.replace(": ", "");

        document.getElementById("editNama").value =
            document.getElementById(`v-nama-${id}`)
                .innerText.replace(": ", "");

        document.getElementById("editTTL").value =
            document.getElementById(`v-ttl-${id}`)
                .innerText.replace(": ", "");

        document.getElementById("editAlamat").value =
            document.getElementById(`v-alamat-${id}`)
                .innerText.replace(": ", "");

        document.getElementById("editJabatan").value =
            document.getElementById(`v-jabatan-${id}`)
                .innerText.replace(": ", "");

        document.getElementById("editJemaat").value =
            document.getElementById(`v-jemaat-${id}`)
                .innerText.replace(": ", "");

        document.getElementById("editKomsel").value =
            document.getElementById(`v-komsel-${id}`)
                .innerText.replace(": ", "");

        const fotoInput =
            document.getElementById("editFoto");

        if (fotoInput) {
            fotoInput.value = "";
        }

        let currentPhoto =
            originalDataStore[id]?.foto || "";

        try {
            const snapshot =
                await db
                    .collection("users")
                    .doc(id)
                    .get();

            if (snapshot.exists) {
                const d =
                    snapshot.data();

                currentPhoto =
                    String(
                        d.foto_profil ||
                        d.url_berkas ||
                        currentPhoto ||
                        ""
                    ).trim();
            }
        } catch (error) {
            console.warn(
                "Foto database tidak dapat dimuat:",
                error
            );
        }

        if (!originalDataStore[id]) {
            originalDataStore[id] = {};
        }

        originalDataStore[id].foto =
            currentPhoto;

        const preview =
            document.getElementById(
                "editFotoPreview"
            );

        if (preview) {
            if (currentPhoto) {
                preview.innerHTML = `
                    <img
                        src="${currentPhoto}"
                        alt="Foto Profil"
                        style="
                            width:100%;
                            height:100%;
                            object-fit:cover;
                            display:block;
                        "
                        onerror="
                            this.style.display='none';
                            this.parentElement.textContent='FOTO';
                        "
                    >
                `;
            } else {
                preview.textContent = "FOTO";
            }
        }

        document.getElementById(
            "editModal"
        ).style.display = "flex";
    }

    function applyToCard() {
        const id =
            document.getElementById(
                "editCardId"
            ).value;

        document.getElementById(
            `v-nama-${id}`
        ).innerText =
            ": " +
            document.getElementById(
                "editNama"
            ).value;

        document.getElementById(
            `v-ttl-${id}`
        ).innerText =
            ": " +
            document.getElementById(
                "editTTL"
            ).value;

        document.getElementById(
            `v-alamat-${id}`
        ).innerText =
            ": " +
            document.getElementById(
                "editAlamat"
            ).value;

        document.getElementById(
            `v-jabatan-${id}`
        ).innerText =
            ": " +
            document.getElementById(
                "editJabatan"
            ).value;

        document.getElementById(
            `v-jemaat-${id}`
        ).innerText =
            ": " +
            document.getElementById(
                "editJemaat"
            ).value;

        document.getElementById(
            `v-komsel-${id}`
        ).innerText =
            ": " +
            document.getElementById(
                "editKomsel"
            ).value;

        document.getElementById(
            `controls-${id}`
        ).style.display = "flex";
    }

    async function saveEditorChanges() {
        const id =
            document.getElementById(
                "editCardId"
            ).value;

        const fotoInput =
            document.getElementById(
                "editFoto"
            );

        const saveButton =
            document.querySelector(
                '#editModal .btn-save-db'
            );

        if (saveButton) {
            saveButton.disabled = true;
            saveButton.innerHTML =
                '<i class="fas fa-spinner fa-spin"></i> MENYIMPAN...';
        }

        try {
            let newPhoto =
                originalDataStore[id]?.foto || "";

            if (
                fotoInput?.files?.[0]
            ) {
                newPhoto =
                    await processEditorPhoto(
                        fotoInput.files[0]
                    );
            }

            if (!originalDataStore[id]) {
                originalDataStore[id] = {};
            }

            originalDataStore[id].foto =
                newPhoto;

            applyToCard();

            await savePermanently(id);

            const cardPhoto =
                document.querySelector(
                    `#card-obj-${id} .photo-frame`
                );

            if (cardPhoto && newPhoto) {
                cardPhoto.src =
                    newPhoto;
            }

            document.getElementById(
                "editModal"
            ).style.display = "none";

            if (fotoInput) {
                fotoInput.value = "";
            }

        } catch (error) {
            console.error(
                "Gagal menyimpan perubahan kartu:",
                error
            );

            /*
             * Fallback:
             * perubahan tetap diterapkan ke tampilan kartu,
             * tetapi database belum berubah.
             */
            applyToCard();

            document.getElementById(
                "editModal"
            ).style.display = "none";

            alert(
                "Perubahan diterapkan pada kartu, tetapi belum tersimpan ke database."
            );

        } finally {
            if (saveButton) {
                saveButton.disabled = false;
                saveButton.innerHTML =
                    '<i class="fas fa-save"></i> SIMPAN';
            }
        }
    }

    function cancelEditorPhoto() {
        const id =
            document.getElementById(
                "editCardId"
            ).value;

        const original =
            originalDataStore[id];

        if (original) {
            const cardPhoto =
                document.querySelector(
                    `#card-obj-${id} .photo-frame`
                );

            if (
                cardPhoto &&
                original.foto
            ) {
                cardPhoto.src =
                    original.foto;
            }
        }

        const input =
            document.getElementById(
                "editFoto"
            );

        if (input) {
            input.value = "";
        }

        document.getElementById(
            "editModal"
        ).style.display = "none";
    }

    async function savePermanently(id) {
        try {
            await db.collection("users").doc(id).update({
                nama_lengkap: document.getElementById(`v-nama-${id}`).innerText.replace(': ', ''),
                tanggal_lahir: document.getElementById(`v-ttl-${id}`).innerText.replace(': ', ''),
                alamat: document.getElementById(`v-alamat-${id}`).innerText.replace(': ', ''),
                jabatan: document.getElementById(`v-jabatan-${id}`).innerText.replace(': ', ''),
                lokasi_berjemaat: document.getElementById(`v-jemaat-${id}`).innerText.replace(': ', ''),
                komsel: document.getElementById(`v-komsel-${id}`).innerText.replace(': ', '')
            });
            alert("Database Diperbarui Permanen!");
            document.getElementById(`controls-${id}`).style.display = 'none';
        } catch (e) { alert("Error: " + e.message); }
    }

    function revertCard(id) {
        const d = originalDataStore[id];
        document.getElementById(`v-nama-${id}`).innerText = ': ' + d.nama;
        document.getElementById(`v-ttl-${id}`).innerText = ': ' + d.ttl;
        document.getElementById(`v-alamat-${id}`).innerText = ': ' + d.alamat;
        document.getElementById(`v-jabatan-${id}`).innerText = ': ' + d.jabatan;
        document.getElementById(`v-jemaat-${id}`).innerText = ': ' + d.jemaat;
        document.getElementById(`v-komsel-${id}`).innerText = ': ' + d.komsel;
        document.getElementById(`controls-${id}`).style.display = 'none';
    }

    // FUNGSI DOWNLOAD JPG
    async function downloadAllCards() {
        const cardWrappers = document.querySelectorAll('.card');
        for (let i = 0; i < cardWrappers.length; i++) {
            const cardElement = cardWrappers[i];
            const nij = cardElement.querySelector('[id^="v-nij"]').innerText.replace(': ', '');
            
            const editBtn = cardElement.querySelector('.btn-edit-trigger');
            editBtn.style.visibility = 'hidden';

            const canvas = await html2canvas(cardElement, {
                scale: 3, 
                useCORS: true,
                logging: false
            });
            
            editBtn.style.visibility = 'visible';

            const link = document.createElement('a');
            link.download = `Kartu_${nij}.jpg`;
            link.href = canvas.toDataURL("image/jpeg", 0.9);
            link.click();
        }
    }

    async function drawCards() {
        const urlParams = new URLSearchParams(window.location.search);
        const ids = urlParams.get('ids') ? urlParams.get('ids').split(',') : [];
        const container = document.getElementById('cardContainer');
        
        for (const id of ids) {
            const doc = await db.collection("users").doc(id).get();
            if (doc.exists) {
                const d = doc.data();
                const nij = d.nij || "00.000";
                const foto = d.foto_profil || 'https://via.placeholder.com/115x140?text=FOTO';
                
                originalDataStore[id] = { 
                    nama: d.nama_lengkap || '-', ttl: d.tanggal_lahir || '-', 
                    alamat: d.alamat || '-', jabatan: d.jabatan || '-', 
                    jemaat: d.lokasi_berjemaat || '-', komsel: d.komsel || '-' 
                };

                container.innerHTML += `
                    <div class="card-wrapper">
                        <div class="card" id="card-obj-${id}">
                            <button class="btn-edit-trigger" onclick="openEditor('${id}')"><i class="fas fa-pencil-alt"></i></button>
                            <div class="card-header">
                                <div class="header-logo">
                                    <img src="logo_pondok.png" crossorigin="anonymous" onerror="this.src='https://via.placeholder.com/70'">
                                </div>
                                <div class="header-text"><h2>PONDOK PEMULIHAN PAPUA</h2><p>KARTU ANGGOTA JEMAAT</p></div>
                                <div class="header-logo">
                                    <img src="gbi.png" crossorigin="anonymous" onerror="this.src='https://via.placeholder.com/70'">
                                </div>
                            </div>
                            <div class="card-body">
                                <div style="display:flex; flex-direction:column; align-items:center; width:125px;">
                                    <img src="${foto}" class="photo-frame" crossorigin="anonymous">
                                    <div style="font-size:8px; font-weight:bold; color:#003366; margin-top:5px;">BERLAKU SEUMUR HIDUP</div>
                                </div>
                                <div class="right-side">
                                    <div class="info-row"><span class="label">NIJ</span><span class="value" id="v-nij-${id}">: ${nij}</span></div>
                                    <div class="info-row"><span class="label">NAMA</span><span class="value" id="v-nama-${id}">: ${originalDataStore[id].nama}</span></div>
                                    <div class="info-row"><span class="label">TTL</span><span class="value" id="v-ttl-${id}">: ${originalDataStore[id].ttl}</span></div>
                                    <div class="info-row"><span class="label">ALAMAT</span><span class="value" id="v-alamat-${id}">: ${originalDataStore[id].alamat}</span></div>
                                    <div class="info-row"><span class="label">JABATAN</span><span class="value" id="v-jabatan-${id}">: ${originalDataStore[id].jabatan}</span></div>
                                    <div class="info-row"><span class="label">JEMAAT</span><span class="value" id="v-jemaat-${id}">: ${originalDataStore[id].jemaat}</span></div>
                                    <div class="info-row"><span class="label">KOMSEL</span><span class="value" id="v-komsel-${id}">: ${originalDataStore[id].komsel}</span></div>
                                    <div class="barcode-container"><svg id="barcode-${id}" style="width:100%; height:100%;"></svg></div>
                                </div>
                            </div>
                            <div class="card-footer">Pondok Pemulihan Papua - Blessing To The Nations</div>
                        </div>
                        <div class="footer-controls" id="controls-${id}">
                            <button class="btn-footer btn-save-db" onclick="savePermanently('${id}')"><i class="fas fa-save"></i> SIMPAN</button>
                            <button class="btn-footer btn-cancel-db" onclick="revertCard('${id}')"><i class="fas fa-times"></i> BATAL</button>
                        </div>
                    </div>`;
                setTimeout(() => JsBarcode(`#barcode-${id}`, nij, { format: "CODE128", displayValue: false, height: 40 }), 300);
            }
        }
    }
    window.onload = drawCards;
</script>
</body>
</html>
