<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Kehadiran - Pondok Pemulihan Papua</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f4f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .card { background: white; padding: 30px; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center; position: relative; }
        .icon-header { font-size: 50px; color: #00a884; margin-bottom: 15px; }
        h2 { color: #003366; margin: 0 0 5px 0; font-size: 22px; font-weight: bold; }
        p.subtitle { color: #777; font-size: 13px; margin-bottom: 25px; }
        .menu-selector, .extra-form { text-align: left; margin-bottom: 20px; }
        label { font-size: 11px; font-weight: bold; color: #555; margin-left: 5px; display: block; margin-top: 10px; text-transform: uppercase; }
        select, input, textarea { width: 100%; padding: 12px; border-radius: 12px; border: 2px solid #e0e0e0; font-size: 14px; margin-top: 5px; outline: none; transition: 0.3s; background: #f9f9f9; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s; color: white; }
        .btn-hadir { background: #00c853; }
        .btn-absen { background: #d81b60; }
        
        #lock-display { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(255,255,255,0.95); z-index: 9999; 
            flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px; box-sizing: border-box;
        }
        #lock-display i { font-size: 80px; margin-bottom: 20px; }
        
        #extention-container, #gabungan-container, #reason-container { display: none; background: #fdfdfd; padding: 15px; border-radius: 15px; border: 1px dashed #ccc; margin-top: 10px; text-align: left; }
    </style>
</head>
<body>

<div id="lock-display">
    <i id="lock-icon"></i>
    <h1 id="lock-title"></h1>
    <p id="lock-msg"></p>
    <button style="margin-top:25px; padding:12px 30px; background:#003366; color:white; border-radius:10px; border:none; font-weight:bold;" onclick="closeLockDisplay()">OKE, MENGERTI</button>
</div>

<div class="card">
    <div class="icon-header"><i class="fa-solid fa-location-dot"></i></div>
    <h2>LAPORAN KEHADIRAN</h2>
    <p class="subtitle">Shalom! Silakan pilih jenis kegiatan jemaat.</p>

    <div class="menu-selector">
        <label><i class="fa-solid fa-list-check"></i> Pilih Jenis Kegiatan:</label>
        <select id="jenis-kegiatan" onchange="cekJenisMenu()">
            <option value="Absen Ibadah Raya">Ibadah Raya</option>
            <option value="Absen Komsel Reguler">Komsel Reguler</option>
            <option value="Absen Komsel Gabungan">Komsel Gabungan</option>
            <option value="Absen Doa">Absen Doa</option>
            <option value="Doa Puasa Jemaat">Doa Puasa Jemaat</option>
            <option value="Absen KD">Absen KD</option>
            <option value="Absen Pertemuan Pemimpin">Pertemuan Pemimpin</option>
            <option value="Absen Latihan PW">Semua Jenis Latihan </option>
            <option value="Absen Pelayanan PW">Semua Jenis Pelayanan PW</option>
            <option value="Pelayanan Non PW">Pelayanan Non PW</option>
            <option value="Absen Extention">KEGIATAN EXTENTION (Lainnya)</option>
        </select>
    </div>

    <div id="wilayah-ibadah-container" style="display:block;">
        <label><i class="fa-solid fa-location-dot"></i> Pilih Wilayah:</label>
        <select id="wilayah-ibadah">
            <option value="">-- Pilih Wilayah --</option>
            <option value="Abepura">Ibadah Abepura</option>
            <option value="Sentani">Ibadah Sentani</option>
            <option value="Doyo">Ibadah Doyo</option>
            <option value="Arso 1">Ibadah Arso 1</option>
            <option value="Arso 2">Ibadah Arso 2</option>
        </select>
    </div>

    <div id="pelayanan-pw-container" class="extra-form" style="display:none;">
        <label><i class="fa-solid fa-hands-helping"></i> Pilihan Pelayanan PW:</label>
        <select id="pelayanan-pw">
            <option value="">-- Pilih Pelayanan PW --</option>
            <option value="WL">WL</option>
            <option value="Pemusik">Pemusik</option>
            <option value="Singers">Singers</option>
            <option value="Choirs">Choirs</option>
        </select>
    </div>

    <div id="pelayanan-nonpw-container" class="extra-form" style="display:none;">
        <label><i class="fa-solid fa-people-group"></i> Pilihan Pelayanan Non PW:</label>
        <select id="pelayanan-nonpw">
            <option value="">-- Pilih Pelayanan Non PW --</option>
            <option value="Soundman">Soundman</option>
            <option value="Operator Live Streaming">Operator Live Streaming</option>
            <option value="Operator Media">Operator Media</option>
            <option value="Crew Floor">Crew Floor</option>
            <option value="Tamborin">Tamborin</option>
            <option value="Flag / Banner">Flag / Banner</option>
            <option value="Desk User">Desk User</option>
            <option value="Gate User">Gate User</option>
            <option value="Parking">Parking</option>
            <option value="General Affairs">General Affairs</option>
        </select>
    </div>
    <div id="gabungan-container">
        <label>Lokasi Komsel :</label>
        <input type="text" id="gab-lokasi" placeholder="Nama Tempat / Alamat">
        
        <label>Nama Komsel Gabungan :</label>
        <input type="text" id="gab-nama" placeholder="Contoh: Gabungan Wilayah A">

        <label>Hari / Tanggal Kegiatan :</label>
        <input type="date" id="gab-tanggal">
    </div>

    <div id="extention-container">
        <label>Nama Kegiatan :</label>
        <input type="text" id="ext-nama-kegiatan" placeholder="Contoh: Kunjungan Jemaat">
        
        <label>Lokasi Kegiatan :</label>
        <input type="text" id="ext-lokasi" placeholder="Alamat / Tempat">

        <label>Tanggal Kegiatan :</label>
        <input type="date" id="ext-tanggal">
    </div>

    <div id="main-buttons" style="margin-top: 20px;">
        <button class="btn btn-hadir" onclick="handleProses('HADIR')">SAYA HADIR <i class="fa-solid fa-circle-check"></i></button>
        <button class="btn btn-absen" onclick="tampilkanInputAlasan()">TIDAK HADIR <i class="fa-solid fa-circle-xmark"></i></button>
    </div>

    <div id="reason-container">
        <textarea id="alasan" rows="3" placeholder="Tulis alasan tidak hadir..."></textarea>
        <button class="btn btn-absen" onclick="handleProses('TIDAK HADIR')">KIRIM LAPORAN</button>
        <button style="background:none; border:none; color:#777; margin-top:10px;" onclick="batalAbsen()">Kembali</button>
    </div>

    <a href="menu.html" style="display:block; margin-top:20px; color:#003366; text-decoration:none; font-weight:bold; font-size:13px;"><i class="fa-solid fa-house"></i> KEMBALI KE MENU</a>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
    const firebaseConfig = { 
        apiKey: "AIzaSyDU2rk0rIF-sos_Sj7C5IMM9dU8z8p_VJM", 
        authDomain: "boby-apps-project.firebaseapp.com", 
        projectId: "boby-apps-project", 
        storageBucket: "boby-apps-project.appspot.com", 
        messagingSenderId: "125984859692", 
        appId: "1:125984859692:web:09f75df5d2e4b6e3bcd389" 
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const userName = localStorage.getItem("userName") || "Jemaat";

    function showLockDisplay(type, title, msg) {
        const lock = document.getElementById('lock-display');
        const icon = document.getElementById('lock-icon');
        lock.style.display = 'flex';
        document.getElementById('lock-title').innerText = title;
        document.getElementById('lock-msg').innerText = msg;
        
        // Pengaturan Icon dan Warna (Termasuk Silang Merah untuk Error/Ditolak)
        icon.className = (type === 'success') ? 'fa-solid fa-circle-check' : (type === 'loading' ? 'fa-solid fa-spinner fa-spin' : 'fa-solid fa-circle-xmark');
        icon.style.color = (type === 'success') ? '#00c853' : (type === 'loading' ? '#007bff' : '#d81b60');
    }

    function closeLockDisplay() {
        document.getElementById('lock-display').style.display = 'none';
        if(document.getElementById('lock-title').innerText.includes("Terimakasih")) location.reload();
    }

    function cekJenisMenu() {
        const menu = document.getElementById("jenis-kegiatan").value;
        document.getElementById("extention-container").style.display = (menu === "Absen Extention") ? "block" : "none";
        document.getElementById("pelayanan-pw-container").style.display = (menu === "Absen Pelayanan PW") ? "block" : "none";
        document.getElementById("pelayanan-nonpw-container").style.display = (menu === "Pelayanan Non PW") ? "block" : "none";
        document.getElementById("gabungan-container").style.display = (menu === "Absen Komsel Gabungan") ? "block" : "none";
        document.getElementById("wilayah-ibadah-container").style.display = (menu === "Absen Ibadah Raya" || menu === "Doa Puasa Jemaat") ? "block" : "none";

        const wilayahOptions = document.querySelectorAll("#wilayah-ibadah option");
        const prefix = (menu === "Doa Puasa Jemaat") ? "Doa Puasa " : "Ibadah ";

        wilayahOptions.forEach(option => {
            if (!option.value) return;
            option.textContent = prefix + option.value;
        });
    }

    function tampilkanInputAlasan() { 
        document.getElementById("main-buttons").style.display = "none"; 
        document.getElementById("reason-container").style.display = "block"; 
    }
    
    function batalAbsen() { 
        document.getElementById("main-buttons").style.display = "block"; 
        document.getElementById("reason-container").style.display = "none"; 
    }

    // --- FUNGSI PROSES UTAMA (REVERSE GEOCODING & GLOBAL LOCK) ---
    async function handleProses(tipe) {
        const menu = document.getElementById("jenis-kegiatan").value;
        const nowLocal = new Date();
        const today =
            `${nowLocal.getFullYear()}-` +
            `${String(nowLocal.getMonth() + 1).padStart(2, "0")}-` +
            `${String(nowLocal.getDate()).padStart(2, "0")}`;

        // 1. Validasi Input Tambahan (Extension & Gabungan)
        if(menu === "Absen Extention") {
            if(!document.getElementById("ext-nama-kegiatan").value || !document.getElementById("ext-tanggal").value) {
                alert("Mohon lengkapi data Kegiatan Extension!");
                return;
            }
        } else if(menu === "Absen Komsel Gabungan") {
            if(!document.getElementById("gab-lokasi").value || !document.getElementById("gab-nama").value || !document.getElementById("gab-tanggal").value) {
                alert("Mohon lengkapi data Komsel Gabungan!");
                return;
            }
        }

        showLockDisplay('loading', 'Memverifikasi...', 'Memeriksa status laporan harian Anda...');

        try {
            // 2. LOCK HARIAN PER JENIS KEGIATAN
            // Reset otomatis berdasarkan pergantian tanggal.
            // Pertemuan Pemimpin dan kegiatan non-rutin
            // tidak terkena daily lock.

            const dailyLockMenus = [
                "Absen Ibadah Raya",
                "Absen Komsel Reguler",
                "Doa Puasa Jemaat"
            ];

            if (dailyLockMenus.includes(menu)) {
                const lockCollection =
                    menu === "Absen Komsel Reguler"
                        ? "laporan_komsel_umum"
                        : menu === "Doa Puasa Jemaat"
                            ? "laporan_doa"
                            : "kehadiran_jemaat";

                const existingReport =
                    await db
                        .collection(lockCollection)
                        .where(
                            "nama",
                            "==",
                            userName
                        )
                        .where(
                            "tanggal",
                            "==",
                            today
                        )
                        .where(
                            "kegiatan",
                            "==",
                            menu
                        )
                        .limit(1)
                        .get();

                if (!existingReport.empty) {
                    showLockDisplay(
                        "error",
                        "Akses Terkunci",
                        `Anda sudah melakukan ${menu} hari ini. Silakan kembali setelah pergantian hari.`
                    );

                    return;
                }
            }

            // 3. JIKA LOLOS, AMBIL LOKASI & ALAMAT
            if (navigator.geolocation) {
                showLockDisplay('loading', 'Melacak Lokasi...', 'Sedang mengambil alamat posisi Anda...');
                
                navigator.geolocation.getCurrentPosition(async (pos) => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    const koordinat = `${lat}, ${lon}`;

                    // REVERSE GEOCODING (Mendapatkan Nama Jalan)
                    try {
                        const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                        const data = await response.json();
                        const alamatLengkap = data.display_name || "Alamat tidak ditemukan";
                        
                        saveData(tipe, koordinat, alamatLengkap);
                    } catch (err) {
                        saveData(tipe, koordinat, "Lokasi terdeteksi (Gagal memuat nama jalan)");
                    }
                }, () => {
                    showLockDisplay('error', 'GPS Mati', 'Mohon aktifkan GPS Anda untuk melakukan laporan.');
                });
            } else {
                showLockDisplay('error', 'Browser Tidak Support', 'Browser Anda tidak mendukung pelacakan lokasi.');
            }

        } catch (e) {
            showLockDisplay('error', 'Sistem Error', e.message);
        }
    }

    async function saveData(tipe, koordinat, alamat) {
        const menu = document.getElementById("jenis-kegiatan").value;
        if (menu === "Absen Ibadah Raya" && !document.getElementById("wilayah-ibadah").value) {
            alert("Mohon pilih wilayah Ibadah Raya terlebih dahulu!");
            return;
        }
        const now = new Date();
        const tglHariIni = now.toISOString().split('T')[0];
        
        // Tentukan koleksi tujuan
        let targetColl = "kehadiran_jemaat";
        if (menu === "Absen Komsel Reguler" || menu === "Absen Komsel Gabungan") {
            targetColl = "laporan_komsel_umum";
        } else if (menu === "Doa Puasa Jemaat") {
            targetColl = "laporan_doa";
        }

        let payload = {
            status: tipe,
            nama: userName,
            tanggal: tglHariIni,
            timestamp: firebase.firestore.FieldValue.serverTimestamp(),
            kegiatan: menu,
            lokasi_koordinat: koordinat,
            ...(menu === "Absen Ibadah Raya" || menu === "Doa Puasa Jemaat" ? { wilayah_ibadah: document.getElementById("wilayah-ibadah").value } : {}),
            alamat_fisik: alamat, // Menyimpan alamat hasil pelacakan
            keterangan: (tipe === 'TIDAK HADIR') ? document.getElementById("alasan").value : "Hadir di Lokasi",
            ...(menu === "Doa Puasa Jemaat" ? {
                status_doa: tipe,
                pokok_doa: (tipe === "TIDAK HADIR") ? document.getElementById("alasan").value : "Hadir di Doa Puasa Jemaat"
            } : {})
        };

        // Data khusus Pelayanan PW / Non PW
        if (menu === "Absen Pelayanan PW") {
            const pelayananPW = document.getElementById("pelayanan-pw").value;
            if (!pelayananPW) {
                alert("Mohon pilih jenis Pelayanan PW terlebih dahulu!");
                return;
            }
            payload.pelayanan_pw = pelayananPW;
        }

        if (menu === "Pelayanan Non PW") {
            const pelayananNonPW = document.getElementById("pelayanan-nonpw").value;
            if (!pelayananNonPW) {
                alert("Mohon pilih jenis Pelayanan Non PW terlebih dahulu!");
                return;
            }
            payload.pelayanan_nonpw = pelayananNonPW;
        }

        // Data khusus Extension
        if (menu === "Absen Extention") {
            payload.extension_nama_kegiatan = document.getElementById("ext-nama-kegiatan").value;
            payload.extension_lokasi = document.getElementById("ext-lokasi").value;
            payload.extension_tanggal = document.getElementById("ext-tanggal").value;
        }

        // Data khusus Komsel Gabungan
        if (menu === "Absen Komsel Gabungan") {
            payload.gabungan_lokasi = document.getElementById("gab-lokasi").value;
            payload.gabungan_nama_komsel = document.getElementById("gab-nama").value;
            payload.gabungan_tanggal_pelaksanaan = document.getElementById("gab-tanggal").value;
        }

        try {
            await db.collection(targetColl).add(payload);
            await db.collection("statistik_jemaat_pusat").add({...payload, type: "Umum_Entry"});
            
            // Tampilan Notifikasi Sesuai Permintaan
            const pesanSukses = (tipe === 'HADIR') 
                ? `Terimakasih sudah melakukan laporan kehadiran.\n\nAlamat Anda:\n${alamat}`
                : `Terimakasih sudah melakukan laporan ketidak hadiran.\n\nAlamat Anda:\n${alamat}`;

            showLockDisplay('success', 'Terimakasih', pesanSukses);
        } catch (err) {
            showLockDisplay('error', 'Gagal Simpan', err.message);
        }
    }
</script></body>
</html>
