<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio Singkat Jemaat</title>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-functions-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="notification/styles/notification.css">
    <style>
        body { font-family: sans-serif; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        
        /* Desain Pop-up Bio */
        .popup-bio { background: white; width: 90%; max-width: 350px; border-radius: 15px; overflow: hidden; display: none; box-shadow: 0 5px 20px rgba(0,0,0,0.3); }
        .header { background: #003366; color: white; padding: 12px; text-align: center; font-weight: bold; }
        .content { padding: 15px; display: flex; align-items: flex-start; gap: 12px; }
        .foto-box { width: 80px; height: 100px; background: #eee; border-radius: 5px; object-fit: cover; }
        .info-box { flex: 1; font-size: 12px; }
        .info-box b { color: #003366; display: block; margin-top: 5px; }
        .footer { display: flex; border-top: 1px solid #eee; }
        .btn { flex: 1; padding: 12px; border: none; font-weight: bold; cursor: pointer; }
        .btn-add { background: #003366; color: white; }
        .btn-cancel { background: #f1f1f1; color: #333; }

        /* Pesan Error */
        #msg-error { background: white; padding: 20px; border-radius: 10px; text-align: center; display: none; max-width: 300px; }
    </style>
</head>
<body>

    <div id="popupBio" class="popup-bio">
        <div class="header">Bio Jemaat</div>
        <div class="content">
            <img id="p-foto" src="https://via.placeholder.com/80x100" class="foto-box">
            <div class="info-box">
                <b>NIJ:</b> <span id="p-nij">-</span>
                <b>NAMA:</b> <span id="p-nama">-</span>
                <b>KOMSEL:</b> <span id="p-komsel">-</span>
                <b>JEMAAT:</b> <span id="p-jemaat">-</span>
            </div>
        </div>
        <div class="footer">
            <button class="btn btn-cancel" onclick="window.location.href='menu.html'">CANCEL</button>
            <button class="btn btn-add" id="btnAdd">ADD</button>
        </div>
    </div>

    <div id="msg-error">
        <p id="errorText" style="font-weight: bold; color: #cc0000;"></p>
        <button onclick="window.location.href='index.html'" style="padding: 10px 20px;">LOG IN</button>
    </div>

<script src="notification/core/queue.js"></script>
<script src="notification/core/lifecycle.js"></script>
<script src="notification/core/error-normalizer.js"></script>
<script src="notification/components/toast.js"></script>
<script src="notification/components/validation.js"></script>
<script src="notification/components/loading.js"></script>
<script src="notification/components/confirmation.js"></script>
<script src="notification/components/security-confirmation.js"></script>
<script src="notification/core/manager.js"></script>
<script src="notification/index.js"></script>
<script src="sipapua-maintenance.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-check-compat.js"></script>
<script src="sipapua-app-check.js"></script>
<script src="sipapua-member-card.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDU2rk0rIF-sos_Sj7C5IMM9dU8z8p_VJM", 
        authDomain: "boby-apps-project.firebaseapp.com", 
        projectId: "boby-apps-project", 
        storageBucket: "boby-apps-project.appspot.com", 
        messagingSenderId: "125984859692", 
        appId: "1:125984859692:web:09f75df5d2e4b6e3bcd389" 
    };
    
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const auth = firebase.auth();

    // Logika Utama: Deteksi Scan langsung di dalam APK
    window.onload = async () => {
        const cardToken = SIPAPUA_MEMBER_CARD.takeScan();
        if (!window.SIPAPUA_MAINTENANCE || window.SIPAPUA_MAINTENANCE.isPaused("memberCard")) {
            const box = document.getElementById('msg-error');
            const text = document.getElementById('errorText');
            const button = box.querySelector('button');
            box.style.display = 'block';
            text.style.color = '#5d4037';
            text.innerText = window.SIPAPUA_MAINTENANCE
                ? window.SIPAPUA_MAINTENANCE.message("memberCard")
                : "Pemindaian kartu jemaat sedang dalam pemeliharaan.";
            button.innerText = 'KEMBALI KE MENU';
            button.onclick = () => { window.location.href = 'menu.html'; };
            return;
        }

        const urlParams = new URLSearchParams(window.location.search);
        const legacyEmailScan = urlParams.has('legacy') || urlParams.has('email') || urlParams.has('scan');

        if (cardToken) {
            await muatDataProfil(cardToken);
        } else {
            document.getElementById('msg-error').style.display = 'block';
            document.getElementById('errorText').innerText = legacyEmailScan
                ? "Kartu QR versi lama. Minta pemilik kartu membuka Kartu Digital terbaru."
                : "Data Scan Tidak Valid.";
        }
    };

    async function muatDataProfil(token) {
        try {
            const scanner = await SIPAPUA_MEMBER_CARD.restoredUser(auth);
            const introduction = await SIPAPUA_MEMBER_CARD.call("scanQrIntroduction", { token });
            if (!scanner || auth.currentUser !== scanner) throw new Error("Sesi berubah.");

            const { member, expiresAt } = introduction;
            let receipt = introduction.receipt;
            document.getElementById('p-nij').innerText = member.nij || "-";
            document.getElementById('p-nama').innerText = member.nama || "-";
            document.getElementById('p-komsel').innerText = "-";
            document.getElementById('p-jemaat').innerText = "-";
            document.getElementById('popupBio').style.display = 'block';

            const btnAdd = document.getElementById('btnAdd');
            const originalText = btnAdd.textContent;
            btnAdd.onclick = async () => {
                if (btnAdd.disabled) return;
                if (auth.currentUser !== scanner) {
                    receipt = null;
                    btnAdd.disabled = true;
                    await Swal.fire({ title: 'Sesi berubah', text: 'Silakan login ulang ke SIPAPUA.', icon: 'warning' });
                    return;
                }
                if (!receipt || !(expiresAt > Date.now())) {
                    receipt = null;
                    btnAdd.disabled = true;
                    await Swal.fire({ title: 'Kartu kedaluwarsa', text: 'Silakan pindai ulang kartu QR.', icon: 'info' });
                    return;
                }

                btnAdd.disabled = true;
                btnAdd.textContent = 'MENGIRIM...';
                try {
                    await SIPAPUA_MEMBER_CARD.call("requestQrIntroduction", { receipt });
                    receipt = null;
                    btnAdd.textContent = 'TERKIRIM';
                    await Swal.fire({
                        title: 'Berhasil!',
                        text: 'Permintaan pertemanan menunggu persetujuan penerima.',
                        icon: 'success',
                        confirmButtonColor: '#003366',
                        heightAuto: false
                    });
                } catch (error) {
                    const denied = error?.code === "functions/permission-denied" || error?.code === "permission-denied";
                    if (denied) receipt = null;
                    btnAdd.textContent = originalText;
                    btnAdd.disabled = denied;
                    await Swal.fire({
                        title: 'Gagal',
                        text: denied
                            ? 'Permintaan tidak tersedia. Silakan pindai ulang jika kartu masih berlaku.'
                            : 'Permintaan pertemanan gagal dikirim.',
                        icon: 'error',
                        confirmButtonColor: '#003366',
                        heightAuto: false
                    });
                }
            };
        } catch (error) {
            const cooldown = error?.code === "functions/resource-exhausted" || error?.code === "resource-exhausted";
            showLookupError(cooldown
                ? "Tunggu sebentar sebelum memindai ulang."
                : "Perkenalan QR tidak tersedia. Periksa sesi dan pastikan penerima mengizinkan perkenalan QR.");
        }
    }

    function showLookupError(message) {
        document.getElementById('msg-error').style.display = 'block';
        document.getElementById('errorText').textContent = message;
    }
</script>
</body>
</html>
