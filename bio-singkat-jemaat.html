<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio Singkat Jemaat</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="notification/styles/notification.css">
    <style>
        body { font-family: sans-serif; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        
        /* Desain Pop-up Bio */
        .popup-bio { background: white; width: 90%; max-width: 350px; border-radius: 15px; overflow: hidden; display: none; box-shadow: 0 5px 20px rgba(0,0,0,0.3); }
        .header { background: #003366; color: white; padding: 12px; text-align: center; font-weight: bold; }
        .content { padding: 15px; display: flex; align-items: flex-start; gap: 12px; }
        .foto-box { width: 80px; height: 100px; background: #eee; border-radius: 5px; object-fit: cover; }
        .info-box { flex: 1; font-size: 12px; }
        .info-box b { color: #003366; display: block; margin-top: 5px; }
        .footer { display: flex; border-top: 1px solid #eee; }
        .btn { flex: 1; padding: 12px; border: none; font-weight: bold; cursor: pointer; }
        .btn-add { background: #003366; color: white; }
        .btn-cancel { background: #f1f1f1; color: #333; }

        /* Pesan Error */
        #msg-error { background: white; padding: 20px; border-radius: 10px; text-align: center; display: none; max-width: 300px; }
    </style>
</head>
<body>

    <div id="popupBio" class="popup-bio">
        <div class="header">Bio Jemaat</div>
        <div class="content">
            <img id="p-foto" src="https://via.placeholder.com/80x100" class="foto-box">
            <div class="info-box">
                <b>NIJ:</b> <span id="p-nij">-</span>
                <b>NAMA:</b> <span id="p-nama">-</span>
                <b>KOMSEL:</b> <span id="p-komsel">-</span>
                <b>JEMAAT:</b> <span id="p-jemaat">-</span>
            </div>
        </div>
        <div class="footer">
            <button class="btn btn-cancel" onclick="window.location.href='menu.html'">CANCEL</button>
            <button class="btn btn-add" id="btnAdd">ADD</button>
        </div>
    </div>

    <div id="msg-error">
        <p id="errorText" style="font-weight: bold; color: #cc0000;"></p>
        <button onclick="window.location.href='index.html'" style="padding: 10px 20px;">LOG IN</button>
    </div>

<script src="notification/core/queue.js"></script>
<script src="notification/core/lifecycle.js"></script>
<script src="notification/core/error-normalizer.js"></script>
<script src="notification/components/toast.js"></script>
<script src="notification/components/validation.js"></script>
<script src="notification/components/loading.js"></script>
<script src="notification/components/confirmation.js"></script>
<script src="notification/components/security-confirmation.js"></script>
<script src="notification/core/manager.js"></script>
<script src="notification/index.js"></script>

<script>
    const firebaseConfig = { 
        apiKey: "AIzaSyDU2rk0rIF-sos_Sj7C5IMM9dU8z8p_VJM", 
        authDomain: "boby-apps-project.firebaseapp.com", 
        projectId: "boby-apps-project", 
        storageBucket: "boby-apps-project.appspot.com", 
        messagingSenderId: "125984859692", 
        appId: "1:125984859692:web:09f75df5d2e4b6e3bcd389" 
    };
    
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Logika Utama: Deteksi Scan langsung di dalam APK
    window.onload = async () => {
        const urlParams = new URLSearchParams(window.location.search);
        
        // Cek parameter 'email' (sesuai protokol baru sipapua://scan?email=...)
        // atau 'scan' (jika masih menggunakan link lama)
        const targetEmail = urlParams.get('email') || urlParams.get('scan'); 
        
        // Karena ini dijalankan di dalam APK, kita asumsikan user sudah login 
        // saat mengakses scanner di menu aplikasi.
        const myEmail = localStorage.getItem("userEmail");

        if (!myEmail) {
            document.getElementById('msg-error').style.display = 'block';
            document.getElementById('errorText').innerText = "Sesi Tidak Ditemukan. Silakan Login di Aplikasi SIPAPUA.";
            return;
        }

        if (targetEmail) {
            muatDataProfil(targetEmail);
        } else {
            document.getElementById('msg-error').style.display = 'block';
            document.getElementById('errorText').innerText = "Data Scan Tidak Valid.";
        }
    };

    async function muatDataProfil(email) {
        try {
            const snap = await db.collection("users").where("email", "==", email).get();
            if (!snap.empty) {
                const data = snap.docs[0].data();
                const targetUid = snap.docs[0].id;
                
                // Isi Data ke UI
                document.getElementById('p-nij').innerText = data.nij || "0000 0000";
                document.getElementById('p-nama').innerText = data.nama || "-";
                document.getElementById('p-komsel').innerText = data.komsel ? "JC " + data.komsel : "-";
                document.getElementById('p-jemaat').innerText = data.lokasi_berjemaat || "Pondok Pemulihan Papua";
                
                if(data.foto_profil) {
                    document.getElementById('p-foto').src = data.foto_profil;
                }
                
                // Tampilkan Pop-up
                document.getElementById('popupBio').style.display = 'block';

                // Logika Tombol Tambah: gunakan sistem friend_requests berbasis UID.
                document.getElementById('btnAdd').onclick = async () => {
                    const btnAdd = document.getElementById('btnAdd');
                    const currentUser = await new Promise(resolve => {
                        let settled = false;
                        const unsubscribe = auth.onAuthStateChanged(user => {
                            if (settled) return;
                            settled = true;
                            unsubscribe();
                            resolve(user);
                        });
                    });

                    if (!currentUser) {
                        await Swal.fire({
                            title: 'Sesi Tidak Ditemukan',
                            text: 'Silakan login ulang ke SIPAPUA.',
                            icon: 'warning',
                            heightAuto: false
                        });
                        window.location.href = 'index.html';
                        return;
                    }

                    if (currentUser.uid === targetUid) {
                        await Swal.fire({
                            title: 'Info',
                            text: 'Ini adalah kartu Anda sendiri.',
                            icon: 'info',
                            heightAuto: false
                        });
                        return;
                    }

                    btnAdd.disabled = true;
                    const originalText = btnAdd.textContent;
                    btnAdd.textContent = 'MENGIRIM...';

                    try {
                        const targetContactRef = db
                            .collection('contacts')
                            .doc(currentUser.uid)
                            .collection('friends')
                            .doc(targetUid);
                        const existingContact = await targetContactRef.get();

                        if (existingContact.exists) {
                            await Swal.fire({
                                title: 'Sudah Berteman',
                                text: 'Jemaat ini sudah ada di daftar kontak Anda.',
                                icon: 'info',
                                heightAuto: false
                            });
                            btnAdd.textContent = 'SUDAH BERTEMAN';
                            return;
                        }

                        const pairRequestId = [currentUser.uid, targetUid].sort().join('_');
                        const requestRef = db.collection('friend_requests').doc(pairRequestId);
                        const requestSnapshot = await requestRef.get().catch(error => {
                                if (error?.code === 'permission-denied') return null;
                                throw error;
                            });

                        if (requestSnapshot.exists) {
                            const requestData = requestSnapshot.data() || {};
                            const requestStatus = String(requestData.status || '').trim().toLowerCase();

                            if (requestStatus === 'pending') {
                                await Swal.fire({
                                    title: 'Sudah Dikirim',
                                    text: 'Permintaan pertemanan sudah dikirim dan menunggu respons.',
                                    icon: 'info',
                                    heightAuto: false
                                });
                                btnAdd.textContent = 'TERKIRIM';
                                return;
                            }

                            if (requestStatus === 'accepted') {
                                await Swal.fire({
                                    title: 'Sudah Berteman',
                                    text: 'Permintaan sebelumnya sudah diterima.',
                                    icon: 'success',
                                    heightAuto: false
                                });
                                btnAdd.textContent = 'SUDAH BERTEMAN';
                                return;
                            }

                            if (requestStatus === 'blocked') {
                                await Swal.fire({
                                    title: 'Tidak Dapat Menambahkan',
                                    text: 'Permintaan pertemanan untuk akun ini sedang diblokir.',
                                    icon: 'warning',
                                    heightAuto: false
                                });
                                btnAdd.textContent = originalText;
                                btnAdd.disabled = false;
                                return;
                            }

                            if (requestStatus === 'rejected') {
                                await Swal.fire({
                                    title: 'Permintaan Sebelumnya Ditolak',
                                    text: 'Permintaan pertemanan sebelumnya sudah ditolak.',
                                    icon: 'info',
                                    heightAuto: false
                                });
                                btnAdd.textContent = originalText;
                                btnAdd.disabled = false;
                                return;
                            }
                        }

                        const ownPresenceSnapshot = await db.collection('presence').doc(currentUser.uid).get();
                        if (!ownPresenceSnapshot.exists) {
                            throw Object.assign(new Error('PRESENCE_NOT_READY'), { code: 'presence-not-ready' });
                        }

                        const ownPresence = ownPresenceSnapshot.data() || {};
                        const fromDisplayName = typeof ownPresence.displayName === 'string' ? ownPresence.displayName : '';
                        const fromPhotoURL = typeof ownPresence.photoURL === 'string' ? ownPresence.photoURL : '';

                        await requestRef.set({
                            fromUid: currentUser.uid,
                            toUid: targetUid,
                            status: 'pending',
                            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                            updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                            fromDisplayName,
                            fromPhotoURL
                        });

                        await Swal.fire({
                            title: 'Berhasil!',
                            text: 'Permintaan pertemanan telah dikirim.',
                            icon: 'success',
                            confirmButtonText: 'OK',
                            confirmButtonColor: '#003366',
                            heightAuto: false
                        });

                        btnAdd.textContent = 'TERKIRIM';
                    } catch (error) {
                        console.error('Gagal mengirim permintaan pertemanan:', error);

                        let message = 'Permintaan pertemanan gagal dikirim.';
                        const code = String(error?.code || '').replace(/^firestore\//, '');

                        if (code === 'permission-denied') {
                            message = 'Permintaan ditolak. Pastikan akun tujuan dapat menerima koneksi dan tidak sedang memblokir Anda.';
                        } else if (code === 'unauthenticated') {
                            message = 'Sesi login tidak valid. Silakan login ulang.';
                        } else if (code === 'presence-not-ready') {
                            message = 'Profil koneksi Anda belum siap. Kembali ke menu utama lalu coba scan lagi.';
                        } else if (code === 'already-exists') {
                            message = 'Permintaan pertemanan sudah ada.';
                        }

                        await Swal.fire({
                            title: 'Gagal',
                            text: message,
                            icon: 'error',
                            confirmButtonColor: '#003366',
                            heightAuto: false
                        });

                        btnAdd.textContent = originalText;
                        btnAdd.disabled = false;
                    }
                };            } else {
                SIPAPUA.notify.error({
                    title: "Error",
                    message: "Data jemaat tidak ditemukan.",
                    duration: 0
                });
            }
        } catch (e) {
            console.error(e);
            SIPAPUA.notify.error({
                title: "Error",
                message: "Gagal mengambil data dari server.",
                duration: 0
            });
        }
    }
</script>
</body>
</html>
