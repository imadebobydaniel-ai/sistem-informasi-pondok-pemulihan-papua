# Review template. Keep blank values until Owner approves isolated staging.
name = "sipapua-qr-staging"
main = "src/worker.mjs"
compatibility_date = "2026-11-21"
workers_dev = false
preview_urls = false

[vars]
FIREBASE_PROJECT_ID = ""
FIREBASE_PROJECT_NUMBER = ""
FIREBASE_APP_ID = ""
ALLOWED_ORIGIN = ""

[observability]
enabled = false

[triggers]
crons = ["*/30 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "sipapua-qr-staging"
database_id = ""

[[ratelimits]]
name = "QR_INGRESS"
namespace_id = ""
simple = { limit = 30, period = 60 }

[[services]]
binding = "QR_AUTHORITY"
service = ""
entrypoint = "QrAuthorityGateway"

