<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pope Shelter - Pondok Pemulihan Papua</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --biru-tua: #003366; --emas: #D4AF37; --bg: #f4f7f6; --merah: #d9534f; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 0; }
        
        .sticky-top-container {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--bg);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .header-app { 
            background: var(--biru-tua); 
            color: white; 
            padding: 18px; 
            display: flex;
            align-items: center;
            position: relative;
        }

        .btn-back {
            color: white;
            font-size: 22px;
            text-decoration: none;
            position: absolute;
            left: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            z-index: 10;
        }

        .header-title {
            width: 100%;
            text-align: center;
            font-weight: bold;
            letter-spacing: 1px;
            font-size: 16px;
            text-transform: uppercase;
        }
        
        .action-container { padding: 15px; max-width: 600px; margin: auto; }
        
        .btn-add { 
            width: 100%; 
            background: var(--biru-tua); 
            color: white; 
            border: none; 
            padding: 15px; 
            border-radius: 12px; 
            font-weight: bold; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
            font-size: 11px;
            text-align: center;
        }

        .content-scroll { padding: 0 15px 15px 15px; max-width: 600px; margin: auto; }

        .kesaksian-card { 
            background: white; 
            border-radius: 15px; 
            padding: 20px; 
            margin-bottom: 20px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.05); 
            border-top: 4px solid var(--emas); 
            position: relative;
        }

        .card-controls {
            display: flex;
            justify-content: flex-end; /* Hanya ada tombol hapus sekarang */
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px dashed #eee;
        }

        .btn-delete { color: var(--merah); cursor: pointer; font-size: 14px; background: none; border: none; font-weight: bold; }

        .kesaksian-text { font-size: 15px; color: #333; line-height: 1.6; margin-bottom: 15px; font-style: italic; white-space: pre-wrap; }
        
        .share-panel { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 15px; 
        }
        
        .btn-share { 
            flex: 1; 
            padding: 10px; 
            border-radius: 8px; 
            border: none; 
            color: white; 
            font-size: 13px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px; 
            font-weight: bold;
        }
        .bg-wa { background: #25D366; }

        .kesaksian-footer { display: flex; align-items: center; gap: 12px; padding-top: 15px; border-top: 1px solid #eee; }
        .author-img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--emas); }
        .author-info { flex: 1; }
        .author-name { font-weight: bold; font-size: 13px; color: var(--biru-tua); margin: 0; }
        .author-meta { font-size: 10px; color: #777; margin: 0; }

        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .popup { background: white; width: 100%; max-width: 400px; border-radius: 20px; padding: 25px; }
        .form-group textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; height: 150px; resize: none; box-sizing: border-box; }
        .btn-save { width: 100%; background: var(--emas); color: var(--biru-tua); border: none; padding: 14px; border-radius: 10px; font-weight: bold; margin-top: 10px; }
        
        .success-toast { 
            position: fixed; top: -100px; left: 50%; transform: translateX(-50%); 
            background: white; color: var(--biru-tua); padding: 15px 25px; 
            border-radius: 50px; z-index: 9999; box-shadow: 0 10px 30px rgba(0,0,0,0.2); 
            display: flex; align-items: center; gap: 10px; font-weight: bold;
            transition: top 0.5s; border-bottom: 3px solid var(--emas);
        }
        .success-toast.show { top: 30px; }
    </style>
</head>
<body>

<div id="toast-success" class="success-toast">
    <i class="fa-solid fa-circle-check" style="color: green; font-size: 20px;"></i>
    <span id="toast-text">Berhasil!</span>
</div>

<div class="sticky-top-container">
    <div class="header-app">
        <a href="menu.html" class="btn-back"><i class="fa-solid fa-circle-chevron-left"></i></a>
        <div class="header-title">RUANG KESAKSIAN</div>
    </div>
    <div class="action-container">
        <button class="btn-add" onclick="bukaPopupAdd()">
            <i class="fa-solid fa-pen-fancy"></i> TULISKAN DAN CERITAKAN KESAKSIAN ANDA UNTUK MEMBERKATI ORANG LAIN
        </button>
    </div>
</div>

<div class="content-scroll">
    <div id="rubrik-kesaksian-container"></div>
</div>

<div id="popup-add" class="overlay">
    <div class="popup">
        <h3 style="text-align:center; color:var(--biru-tua)">Bagikan Kesaksian</h3>
        <div class="form-group">
            <textarea id="add-cerita" placeholder="Tuliskan kebaikan Tuhan..."></textarea>
        </div>
        <button class="btn-save" id="btnKirim" onclick="simpanKesaksian()">POSTING SEKARANG</button>
        <div style="text-align:center; margin-top:15px; color:#999; cursor:pointer;" onclick="tutupPopup()">Batal</div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDU2rk0rIF-sos_Sj7C5IMM9dU8z8p_VJM",
        authDomain: "boby-apps-project.firebaseapp.com",
        projectId: "boby-apps-project",
        storageBucket: "boby-apps-project.appspot.com",
        messagingSenderId: "125984859692",
        appId: "1:125984859692:web:09f75df5d2e4b6e3bcd389"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUserData = null;
    let unsubscribeKesaksian = null;

    function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, character => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[character]);
    }

    function safePhotoUrl(value) {
        const fallback = "https://via.placeholder.com/100";
        if (!value) return fallback;

        const candidate = String(value).trim();
        const dataUrlMatch = candidate.match(
            /^data:image\/(jpeg|png|webp|gif);base64,([A-Za-z0-9+/]+={0,2})$/i
        );

        if (dataUrlMatch) {
            const base64 = dataUrlMatch[2];
            const validBase64 = /^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/;
            if (base64.length > 0 && validBase64.test(base64)) {
                return candidate;
            }
        }

        try {
            const url = new URL(candidate, window.location.href);
            return ["https:", "http:"].includes(url.protocol)
                ? url.href
                : fallback;
        } catch (_) {
            return fallback;
        }
    }

    function showProfileError(message) {
        document.getElementById("rubrik-kesaksian-container").textContent = message;
        showToast(message);
    }

    function loadRubrikKesaksian() {
        if (unsubscribeKesaksian) unsubscribeKesaksian();

        unsubscribeKesaksian = db.collection("kesaksian")
            .orderBy("timestamp", "desc")
            .onSnapshot(snap => {
            let html = "";
            if (snap.empty) {
                html = "<p style='text-align:center; color:#888; margin-top:30px;'>Belum ada kesaksian.</p>";
            }
            snap.forEach(doc => {
                const data = doc.data();
                const id = doc.id;
                const isiMurni = String(data.isi_kesaksian || "").replace(/\s+/g, " ");
                const namaPenulis = data.author_nama || "Anonim";
                const nijPenulis = data.author_nij || "-";
                const komselPenulis = data.author_komsel || "Umum";
                const foto = safePhotoUrl(data.author_foto);
                const canDelete = Boolean(
                    auth.currentUser && data.author_uid === auth.currentUser.uid
                );

                const deleteButton = canDelete
                    ? '<button class="btn-delete" type="button" data-delete-id="' + escapeHTML(id) + '"><i class="fa-solid fa-trash-can"></i> Hapus</button>'
                    : '';

                html += [
                    '<div class="kesaksian-card" id="card-' + escapeHTML(id) + '">',
                    '<div class="card-controls">' + deleteButton + '</div>',
                    '<div class="kesaksian-text">&quot;' + escapeHTML(data.isi_kesaksian || "") + '&quot;</div>',
                    '<div class="share-panel">',
                    '<button class="btn-share bg-wa" type="button" data-share-story="' + escapeHTML(isiMurni) + '" data-share-name="' + escapeHTML(namaPenulis) + '" data-share-nij="' + escapeHTML(nijPenulis) + '" data-share-komsel="' + escapeHTML(komselPenulis) + '">',
                    '<i class="fa-brands fa-whatsapp"></i> BAGIKAN KE WHATSAPP',
                    '</button>',
                    '</div>',
                    '<div class="kesaksian-footer">',
                    '<img src="' + escapeHTML(foto) + '" class="author-img" alt="Foto ' + escapeHTML(namaPenulis) + '" onerror="this.src=\'https://via.placeholder.com/100\'">',
                    '<div class="author-info">',
                    '<p class="author-name">' + escapeHTML(namaPenulis) + '</p>',
                    '<p class="author-meta">NIJ: ' + escapeHTML(nijPenulis) + ' • ' + escapeHTML(komselPenulis) + '</p>',
                    '</div>',
                    '</div>',
                    '</div>'
                ].join("");
            });
            document.getElementById("rubrik-kesaksian-container").innerHTML = html;
        }, error => {
            showProfileError(error.code === "permission-denied"
                ? "Login diperlukan untuk membaca kesaksian."
                : "Kesaksian belum dapat dimuat.");
        });
    }

    document.getElementById("rubrik-kesaksian-container").addEventListener("click", event => {
        const deleteButton = event.target.closest("[data-delete-id]");
        if (deleteButton) {
            hapusKesaksian(deleteButton.dataset.deleteId);
            return;
        }

        const shareButton = event.target.closest("[data-share-story]");
        if (shareButton) {
            shareWA(
                shareButton.dataset.shareStory,
                shareButton.dataset.shareName,
                shareButton.dataset.shareNij,
                shareButton.dataset.shareKomsel
            );
        }
    });

    function shareWA(isi, nama, nij, komsel) {
        const teks = `*SIPAPUA*\n(Sistem Informasi Pondok Pemulihan Papua)\n_Pope Shelter_\n\n*Kesaksian:*\n"${isi}"\n\n---\n*Penulis:* ${nama}\n*NIJ:* ${nij}\n*Komsel:* ${komsel}`;
        const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(teks)}`;
        window.open(url, '_blank');
    }

    async function hapusKesaksian(id) {
        if (!auth.currentUser) {
            window.location.replace("index.html");
            return;
        }

        if(confirm("Apakah Anda yakin ingin menghapus kesaksian ini?")) {
            try {
                await db.collection("kesaksian").doc(id).delete();
                showToast("Kesaksian telah dihapus");
            } catch (e) {
                showToast(e.code === "permission-denied"
                    ? "Anda hanya dapat menghapus kesaksian milik sendiri."
                    : "Kesaksian gagal dihapus.");
            }
        }
    }

    async function simpanKesaksian() {
        const cerita = document.getElementById('add-cerita').value.trim();
        if (!cerita) return;
        const user = auth.currentUser;
        if (!user || !currentUserData) {
            window.location.replace("index.html");
            return;
        }

        const btn = document.getElementById('btnKirim');
        btn.disabled = true;
        try {
            await db.collection("kesaksian").add({
                isi_kesaksian: cerita,
                author_uid: user.uid,
                author_nama: currentUserData.nama_lengkap || currentUserData.nama || user.displayName || "Jemaat SIPAPUA",
                author_nij: currentUserData.nij || currentUserData.no_komsel || "-",
                author_komsel: currentUserData.nama_komsel || currentUserData.lokasi_komsel || currentUserData.komsel || "Umum",
                author_foto: currentUserData.foto_profil || currentUserData.foto || user.photoURL || "",
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            tutupPopup();
            document.getElementById('add-cerita').value = "";
            showToast("Kesaksian Berhasil Diposting!");
        } catch (e) {
            showToast(e.code === "permission-denied"
                ? "Posting ditolak. Silakan login ulang lalu coba lagi."
                : "Kesaksian gagal diposting.");
        }
        finally { btn.disabled = false; }
    }

    function showToast(msg) {
        const toast = document.getElementById('toast-success');
        document.getElementById('toast-text').innerText = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function bukaPopupAdd() { document.getElementById('popup-add').style.display = 'flex'; }
    function tutupPopup() { document.getElementById('popup-add').style.display = 'none'; }

    auth.onAuthStateChanged(async user => {
        currentUserData = null;
        if (unsubscribeKesaksian) {
            unsubscribeKesaksian();
            unsubscribeKesaksian = null;
        }

        if (!user) {
            window.location.replace("index.html");
            return;
        }

        try {
            const profileSnapshot = await db.collection("users").doc(user.uid).get();
            if (!auth.currentUser || auth.currentUser.uid !== user.uid) return;

            if (!profileSnapshot.exists) {
                showProfileError("Profil pengguna tidak ditemukan.");
                return;
            }

            currentUserData = profileSnapshot.data() || {};
            loadRubrikKesaksian();
        } catch (error) {
            showProfileError(error.code === "permission-denied"
                ? "Profil tidak dapat dibaca. Silakan login ulang."
                : "Profil pengguna belum dapat dimuat.");
        }
    });
</script>
</body>
</html>
