# Supabase CLI configuration for APLIKASI SIPAPUA Edge Functions.
project_id = "cfnimvrxrnmefmxtzqks"

# Callers send a Firebase ID token, not a Supabase JWT. The gateway must not
# reject it; the function verifies the Firebase token itself (Google JWKS,
# issuer, audience, expiry) and checks admin_users before deleting anything.
[functions.admin-delete-event-jemaat]
verify_jwt = false

# Same Firebase-token model for Program Tahunan / Kegiatan Tahunan deletes.
[functions.admin-delete-annual-records]
verify_jwt = false
