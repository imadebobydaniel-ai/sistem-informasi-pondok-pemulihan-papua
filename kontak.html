<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak - Pondok Pemulihan Papua</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #2563eb;
            --danger-color: #dc2626;
            --bg-color: #f1f5f9;
            --text-dark: #1e293b;
        }

        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg-color); 
            margin: 0; 
            padding: 10px; 
            display: flex;
            justify-content: center;
        }

        .contact-container { 
            width: 100%;
            max-width: 480px; 
            background: white; 
            border-radius: 16px; 
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); 
            overflow: hidden;
            min-height: 90vh;
        }

        /* Header & Search Bar */
        .contact-header { 
            padding: 20px;
            background: white;
            border-bottom: 1px solid #e2e8f0;
        }

        .contact-header h3 { 
            margin: 0 0 15px 0; 
            color: var(--text-dark);
            font-size: 1.25rem;
        }

        .search-bar { 
            position: relative; 
        }

        .search-icon { 
            position: absolute; 
            left: 12px; 
            top: 50%; 
            transform: translateY(-50%); 
            color: #94a3b8; 
        }

        .search-bar input { 
            width: 100%; 
            padding: 12px 12px 12px 40px; 
            border: 1px solid #cbd5e1; 
            border-radius: 10px; 
            box-sizing: border-box; 
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
        }

        .search-bar input:focus {
            border-color: var(--primary-color);
        }

        /* Action Bar */
        .action-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 10px 20px; 
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
        }

        .check-all-label {
            font-size: 14px;
            color: #64748b;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-delete { 
            background: var(--danger-color); 
            color: white; 
            border: none; 
            padding: 6px 12px; 
            border-radius: 6px; 
            cursor: pointer; 
            display: none; 
            font-size: 13px;
            font-weight: 500;
        }

        /* Contact List */
        .contact-list {
            padding: 0;
        }

        .social-section { padding: 14px 20px; border-bottom: 1px solid #e2e8f0; }
        .social-section h4 { margin: 0 0 10px; color: var(--text-dark); }
        .social-contact { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid #f1f5f9; }
        .social-contact .profile-img { margin: 0; flex: 0 0 45px; }
        .social-contact-info { min-width: 0; flex: 1; }
        .social-contact-meta { margin-top: 4px; color: #64748b; font-size: 12px; }
        .social-contact button, .blocked-contact button { border: 0; border-radius: 7px; padding: 8px 9px; color: white; background: var(--danger-color); font-size: 11px; font-weight: 700; }
        .social-empty { color: #64748b; font-size: 13px; }
        .blocked-contact { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
        .blocked-contact span { flex: 1; }
        .blocked-contact button { background: var(--primary-color); }

        .contact-item { 
            display: flex; 
            align-items: center; 
            padding: 12px 20px; 
            border-bottom: 1px solid #f1f5f9; 
            transition: 0.2s; 
        }

        .contact-item:hover { background: #f8fafc; }

        .contact-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .profile-img { 
            width: 45px; 
            height: 45px; 
            border-radius: 50%; 
            object-fit: cover; 
            margin: 0 15px; 
            background: #e2e8f0; 
        }

        .contact-info { flex-grow: 1; }

        .contact-name { 
            font-weight: 600; 
            color: var(--text-dark); 
            font-size: 15px;
        }

        .edit-icon { 
            color: var(--primary-color); 
            cursor: pointer; 
            padding: 8px;
            font-size: 18px;
        }

        /* Modal Edit */
        .modal { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.5); 
            align-items: center; 
            justify-content: center; 
            z-index: 1000;
        }

        .modal-content { 
            background: white; 
            padding: 20px; 
            border-radius: 12px; 
            width: 85%; 
            max-width: 350px; 
        }

        .modal-content h4 { margin-top: 0; }

        .modal-content input { 
            width: 100%; 
            padding: 10px; 
            margin: 15px 0; 
            box-sizing: border-box; 
            border: 1px solid #cbd5e1;
            border-radius: 8px;
        }

        .modal-actions { 
            display: flex; 
            justify-content: flex-end; 
            gap: 10px; 
        }

        .btn-cancel { background: #e2e8f0; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
        .btn-save { background: var(--primary-color); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="contact-container">
        <div class="contact-header">
            <h3>Daftar Kontak</h3>
            <div class="search-bar">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="searchInput" placeholder="Cari nama kontak...">
            </div>
        </div>

        <div class="action-bar">
            <label class="check-all-label">
                <input type="checkbox" id="checkAll"> Pilih Semua
            </label>
            <div class="action-buttons">
                <button id="deleteSelected" class="btn-delete" onclick="deleteChecked()">
                    <i class="fas fa-trash"></i> Hapus
                </button>
            </div>
        </div>

        <section id="socialSection" class="social-section" hidden>
            <h4>Kontak Jemaat</h4>
            <div id="socialContactList" class="social-empty">Memuat kontak jemaat...</div>
            <h4 style="margin-top:18px;">Pengguna Diblokir</h4>
            <div id="blockedContactList" class="social-empty">Memuat daftar blokir...</div>
        </section>
        <div id="contactList" class="contact-list"></div>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <h4>Edit Kontak</h4>
            <input type="hidden" id="editId">
            <label style="font-size: 12px; color: #64748b;">Nama Kontak</label>
            <input type="text" id="editName" placeholder="Masukkan nama baru">
            <div class="modal-actions">
                <button onclick="closeModal()" class="btn-cancel">Batal</button>
                <button onclick="saveEdit()" class="btn-save">Simpan</button>
            </div>
        </div>
    </div>

    <script>
        // --- LOGIKA PENYIMPANAN DATA ---
        
        // Ambil data dari LocalStorage saat halaman dimuat
        // Jika storage kosong, gunakan data dummy sebagai awalan
        let defaultContacts = [
            { id: 101, name: "Boby Creative", photo: "https://ui-avatars.com/api/?name=Boby+Creative&background=0D8ABC&color=fff" },
            { id: 102, name: "Admin Pondok", photo: "https://ui-avatars.com/api/?name=Admin+Pondok&background=2563eb&color=fff" }
        ];

        let contacts = JSON.parse(localStorage.getItem('saved_contacts')) || defaultContacts;

        const contactList = document.getElementById('contactList');
        const searchInput = document.getElementById('searchInput');
        const checkAll = document.getElementById('checkAll');
        const deleteBtn = document.getElementById('deleteSelected');

        // Fungsi Render List
        function renderContacts(data) {
            contactList.innerHTML = '';
            
            // Selalu simpan perubahan terbaru ke LocalStorage
            localStorage.setItem('saved_contacts', JSON.stringify(contacts));

            if (data.length === 0) {
                contactList.innerHTML = '<p style="text-align:center; color:#94a3b8; margin-top:20px;">Tidak ada kontak ditemukan.</p>';
                return;
            }

            data.forEach(c => {
                contactList.innerHTML += `
                    <div class="contact-item">
                        <input type="checkbox" class="contact-checkbox" data-id="${c.id}">
                        <img src="${c.photo}" alt="Profile" class="profile-img">
                        <div class="contact-info">
                            <div class="contact-name">${c.name}</div>
                        </div>
                        <i class="fas fa-edit edit-icon" title="Edit" onclick="openEdit(${c.id}, '${c.name}')"></i>
                    </div>
                `;
            });
            setupCheckboxListeners();
        }

        // Fungsi untuk Menambah Kontak Baru (Gunakan ini setelah scan kartu digital berhasil)
        function addNewContact(name, photoUrl = "") {
            const newId = Date.now(); // Gunakan timestamp sebagai ID unik
            const photo = photoUrl || `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=random&color=fff`;
            
            contacts.unshift({ id: newId, name: name, photo: photo });
            renderContacts(contacts);
        }

        // --- FITUR INTERAKSI ---

        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = contacts.filter(c => c.name.toLowerCase().includes(term));
            renderContacts(filtered);
        });

        checkAll.addEventListener('change', (e) => {
            const checkboxes = document.querySelectorAll('.contact-checkbox');
            checkboxes.forEach(cb => cb.checked = e.target.checked);
            toggleDeleteBtn();
        });

        function setupCheckboxListeners() {
            document.querySelectorAll('.contact-checkbox').forEach(cb => {
                cb.addEventListener('change', () => {
                    toggleDeleteBtn();
                    if (!cb.checked) checkAll.checked = false;
                });
            });
        }

        function toggleDeleteBtn() {
            const checkedCount = document.querySelectorAll('.contact-checkbox:checked').length;
            deleteBtn.style.display = checkedCount > 0 ? 'block' : 'none';
        }

        function deleteChecked() {
            if (confirm('Hapus kontak yang dipilih?')) {
                const checkedIds = Array.from(document.querySelectorAll('.contact-checkbox:checked'))
                                       .map(cb => parseInt(cb.getAttribute('data-id')));
                
                contacts = contacts.filter(c => !checkedIds.includes(c.id));
                checkAll.checked = false;
                toggleDeleteBtn();
                renderContacts(contacts);
            }
        }

        function openEdit(id, name) {
            document.getElementById('editId').value = id;
            document.getElementById('editName').value = name;
            document.getElementById('editModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        function saveEdit() {
            const id = document.getElementById('editId').value;
            const newName = document.getElementById('editName').value;
            
            const index = contacts.findIndex(c => c.id == id);
            if (index !== -1 && newName.trim() !== "") {
                contacts[index].name = newName;
                renderContacts(contacts);
                closeModal();
            }
        }

        // Jalankan saat pertama kali buka
        renderContacts(contacts);
    </script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDU2rk0rIF-sos_Sj7C5IMM9dU8z8p_VJM",
            authDomain: "boby-apps-project.firebaseapp.com",
            projectId: "boby-apps-project",
            storageBucket: "boby-apps-project.appspot.com",
            messagingSenderId: "125984859692",
            appId: "1:125984859692:web:09f75df5d2e4b6e3bcd389"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

        const contactAuth = firebase.auth();
        const contactDb = firebase.firestore();
        const socialSection = document.getElementById("socialSection");
        const socialContactList = document.getElementById("socialContactList");
        const blockedContactList = document.getElementById("blockedContactList");
        let contactAuthUser = null;
        let socialContacts = [];
        const onlineFreshnessMs = 3 * 60 * 1000;

        function safePhoto(value) {
            try {
                const parsed = new URL(String(value || ""));
                return parsed.protocol === "https:" ? parsed.href : "";
            } catch (_) {
                return "";
            }
        }

        function appendSocialContact(item) {
            const row = document.createElement("div");
            row.className = "social-contact";
            const photo = document.createElement("img");
            photo.className = "profile-img";
            photo.alt = "Foto profil";
            photo.src = safePhoto(item.photoURL) || "https://ui-avatars.com/api/?name=Jemaat&background=2563eb&color=fff";
            const info = document.createElement("div");
            info.className = "social-contact-info";
            const name = document.createElement("div");
            name.className = "contact-name";
            name.textContent = item.displayName || "Jemaat SIPAPUA";
            const status = document.createElement("div");
            status.className = "social-contact-meta";
            status.textContent = item.online ? "Online" : "Offline atau status disembunyikan";
            info.append(name, status);
            const blockButton = document.createElement("button");
            blockButton.type = "button";
            blockButton.textContent = "BLOKIR";
            blockButton.addEventListener("click", () => blockSocialContact(item));
            row.append(photo, info, blockButton);
            socialContactList.appendChild(row);
        }

        async function loadSocialContacts() {
            if (!contactAuthUser?.uid) return;
            socialContactList.textContent = "Memuat kontak jemaat...";
            const snapshot = await contactDb.collection("contacts").doc(contactAuthUser.uid).collection("friends").get();
            socialContacts = await Promise.all(snapshot.docs.map(async (contactDoc) => {
                const data = contactDoc.data();
                let online = false;
                try {
                    const presence = await contactDb.collection("presence").doc(contactDoc.id).get();
                    const state = presence.exists ? presence.data() : {};
                    const lastSeen = state.lastSeen?.toMillis?.() || 0;
                    online = state.online === true && state.showOnline === true && Date.now() - lastSeen <= onlineFreshnessMs;
                } catch (_) {
                    online = false;
                }
                return {
                    uid: contactDoc.id,
                    displayName: String(data.displayName || "Jemaat SIPAPUA"),
                    photoURL: safePhoto(data.photoURL),
                    online
                };
            }));
            renderSocialContacts();
        }

        function renderSocialContacts() {
            socialContactList.replaceChildren();
            if (!socialContacts.length) {
                socialContactList.textContent = "Belum ada kontak jemaat yang diterima.";
                socialContactList.className = "social-empty";
                return;
            }
            socialContactList.className = "";
            socialContacts.forEach(appendSocialContact);
        }

        async function loadBlockedContacts() {
            if (!contactAuthUser?.uid) return;
            const snapshot = await contactDb.collection("user_blocks").doc(contactAuthUser.uid).collection("blocked").get();
            blockedContactList.replaceChildren();
            if (snapshot.empty) {
                blockedContactList.textContent = "Tidak ada pengguna yang diblokir.";
                blockedContactList.className = "social-empty";
                return;
            }
            blockedContactList.className = "";
            snapshot.docs.forEach((blockedDoc) => {
                const data = blockedDoc.data();
                const row = document.createElement("div");
                row.className = "blocked-contact";
                const photo = document.createElement("img");
                photo.className = "profile-img";
                photo.alt = "Foto profil";
                photo.src = safePhoto(data.photoURL) || "https://ui-avatars.com/api/?name=Jemaat&background=2563eb&color=fff";
                const name = document.createElement("span");
                name.textContent = data.displayName || "Pengguna SIPAPUA";
                const unblock = document.createElement("button");
                unblock.type = "button";
                unblock.textContent = "BUKA BLOKIR";
                unblock.addEventListener("click", async () => {
                    unblock.disabled = true;
                    try {
                        await contactDb.collection("user_blocks").doc(contactAuthUser.uid).collection("blocked").doc(blockedDoc.id).delete();
                        await loadBlockedContacts();
                    } catch (error) {
                        console.error("Buka blokir gagal:", error);
                        unblock.disabled = false;
                    }
                });
                row.append(photo, name, unblock);
                blockedContactList.appendChild(row);
            });
        }

        async function blockSocialContact(item) {
            if (!contactAuthUser?.uid) return;
            try {
                const blockRef = contactDb.collection("user_blocks").doc(contactAuthUser.uid).collection("blocked").doc(item.uid);
                const existingBlock = await blockRef.get();
                const [outgoing, incoming] = await Promise.all([
                    contactDb.collection("friend_requests").where("fromUid", "==", contactAuthUser.uid).where("toUid", "==", item.uid).where("status", "==", "pending").get(),
                    contactDb.collection("friend_requests").where("fromUid", "==", item.uid).where("toUid", "==", contactAuthUser.uid).where("status", "==", "pending").get()
                ]);
                const batch = contactDb.batch();
                if (!existingBlock.exists) {
                    batch.set(blockRef, {
                        blockedUid: item.uid,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        displayName: item.displayName,
                        photoURL: item.photoURL || ""
                    });
                }
                [...outgoing.docs, ...incoming.docs].forEach((requestDoc) => {
                    batch.update(requestDoc.ref, {
                        status: "blocked",
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                });
                await batch.commit();
                await Promise.all([loadSocialContacts(), loadBlockedContacts()]);
            } catch (error) {
                console.error("Blokir pengguna gagal:", error);
                alert("Pengguna tidak dapat diblokir sekarang.");
            }
        }

        contactAuth.onAuthStateChanged(async (user) => {
            contactAuthUser = user || null;
            if (!user) {
                socialSection.hidden = true;
                return;
            }
            socialSection.hidden = false;
            try {
                await Promise.all([loadSocialContacts(), loadBlockedContacts()]);
            } catch (error) {
                console.error("Kontak jemaat gagal dimuat:", error);
                socialContactList.textContent = "Kontak jemaat belum dapat dimuat.";
                blockedContactList.textContent = "Daftar blokir belum dapat dimuat.";
            }
        });
    </script>
</body>
</html>
