<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Data Users - Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"> 
    <style>
        :root { --primary: #003366; --accent: #007bff; --light: #f4f7f6; --gold: #D4AF37; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--light); padding: 20px; }
        .edit-container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; position: relative; } 
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; color: var(--primary); }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        input[readonly] { background: #eee; cursor: not-allowed; }
        .pass-wrapper { position: relative; }
        .toggle-password { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #666; }
        .btn-save { background: var(--primary); color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 20px; font-size: 16px; transition: 0.3s; }
        .btn-save:hover { background: #002244; }
        .btn-back { display: inline-block; margin-bottom: 20px; color: var(--primary); text-decoration: none; font-weight: bold; }
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .section-title { color: var(--primary); border-bottom: 2px solid var(--gold); padding-bottom: 10px; margin-bottom: 20px; }
        /* Style Tambahan untuk Info File */
        .file-info { font-size: 12px; color: #666; margin-top: 5px; display: block; }
        .file-info a { color: var(--accent); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div id="loading" class="loading-overlay"><p><i class="fas fa-spinner fa-spin"></i> Memuat Data...</p></div>

<div class="edit-container">
    <a href="database-jemaat.html" class="btn-back"><i class="fas fa-arrow-left"></i> Kembali ke Database Jemaat</a>
    <h2 class="section-title">Edit Profil User</h2>
    
    <form id="editForm">
        <div class="form-group">
            <label>Nama Lengkap</label>
            <input type="text" id="nama_lengkap" required>
        </div>
        <div class="form-group">
            <label>NIJ (Nomor Induk Jemaat)</label>
            <input type="text" id="nij" readonly>
        </div>

        <div class="form-group">
            <label>Tanggal Lahir</label>
            <input type="date" id="tanggal_lahir_murni">
        </div>

        <div class="form-group">
            <label>Jenis Kelamin</label>
            <select id="jenis_kelamin">
                <option value="">-- Pilih --</option>
                <option value="Laki-laki">Laki-laki</option>
                <option value="Perempuan">Perempuan</option>
            </select>
        </div>

        <div class="form-group">
            <label>Golongan Darah</label>
            <select id="gol_darah">
                <option value="-">-</option>
                <option value="O">O</option>
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="AB">AB</option>
                <option value="AB+">AB+</option>
            </select>
        </div>

                <div class="form-group">
            <label>Apakah Sudah Dibaptis?</label>
            <select id="sudah_dibaptis">
                <option value="">-- Pilih --</option>
                <option value="Sudah">Sudah</option>
                <option value="Belum">Belum</option>
            </select>
        </div>

        <div class="form-group">
            <label>
                Apakah Sudah Mengikuti Pengajaran Pemuridan KD
                (Kingdom Discipleship)?
            </label>
            <select
                id="pemuridan_kd"
                onchange="toggleEditPemuridanKD()"
            >
                <option value="">-- Pilih --</option>
                <option value="Sudah">Sudah</option>
                <option value="Belum">Belum</option>
            </select>
        </div>

        <div
            class="form-group"
            id="pemuridan_kd_angkatan_container"
            style="display:none;"
        >
            <label>Angkatan Pemuridan KD</label>
            <input
                type="number"
                id="pemuridan_kd_angkatan"
                min="1"
                placeholder="Contoh: 1"
            >
        </div>

        <div class="form-group">
            <label>
                Apakah Sudah Mengikuti Pengajaran Alpha
                (Khusus Remaja)?
            </label>
            <select
                id="sudah_alpha"
                onchange="toggleEditAlpha()"
            >
                <option value="">-- Pilih --</option>
                <option value="Sudah">Sudah</option>
                <option value="Belum">Belum</option>
            </select>
        </div>

        <div
            class="form-group"
            id="alpha_angkatan_container"
            style="display:none;"
        >
            <label>Angkatan Alpha</label>
            <input
                type="number"
                id="alpha_angkatan"
                min="1"
                placeholder="Contoh: 1"
            >
        </div>
<div class="form-group">
            <label>Provinsi Kelahiran</label>
            <select id="provinsi_lahir">
                <option value="">Pilih Provinsi</option>
            </select>
        </div>

        <div class="form-group">
            <label>Kota / Kabupaten Kelahiran</label>
            <select id="kota_lahir">
                <option value="">Pilih Kota</option>
            </select>
        </div>

        <div class="form-group">
            <label>Kecamatan Kelahiran</label>
            <select id="kecamatan_lahir">
                <option value="">Pilih Kecamatan</option>
            </select>
        </div>

        <div class="form-group">
            <label>Desa / Kelurahan Kelahiran</label>
            <select id="desa_lahir">
                <option value="">Pilih Desa</option>
            </select>
        </div>

        <div class="form-group">
            <label>Pekerjaan</label>
            <input type="text" id="pekerjaan">
        </div>

        <div class="form-group">
            <label>Status Pernikahan</label>
            <select id="status_pernikahan">
                <option value="">-- Pilih --</option>
                <option value="Menikah">Menikah</option>
                <option value="Single">Single</option>
                <option value="Duda">Duda</option>
                <option value="Janda">Janda</option>
            </select>
        </div>

        <div class="form-group">
            <label>Nama Istri / Suami</label>
            <input type="text" id="nama_pasangan">
        </div>

        <div class="form-group">
            <label>Jumlah Anak</label>
            <input type="number" id="jumlah_anak" min="0">
        </div>

        <div id="edit_child_fields_container"></div>

                <div class="form-group">
            <label>
                Apakah orang tua berjemaat di Pondok Pemulihan Papua?
            </label>
            <select id="orang_tua_berjemaat">
                <option value="">-- Pilih --</option>
                <option value="Ya">Ya</option>
                <option value="Tidak">Tidak</option>
            </select>
        </div>

        <div id="edit_parent_fields" style="display:none;">

            <div class="form-group">
                <label>Nama Ayah</label>
                <input type="text" id="nama_ayah">
            </div>

            <div class="form-group">
                <label>Nama Ibu</label>
                <input type="text" id="nama_ibu">
            </div>

            <div class="form-group">
                <label>Wilayah Ibadah Orang Tua</label>
                <input
                    type="text"
                    id="wilayah_orang_tua"
                    placeholder="Contoh: Abepura"
                >
            </div>

        </div>

        <div class="form-group">
            <label>WhatsApp</label>
            <input type="text" id="whatsapp">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email">
        </div>

        <div class="form-group">
            <label>Password Akun (Akses Jemaat)</label>
            <div class="pass-wrapper">
                <input type="password" id="password_user" placeholder="Masukkan password baru jika ingin diubah">
                <i class="fas fa-eye toggle-password" id="eyeIcon"></i>
            </div>
        </div>

        <div class="form-group">
            <label>Provinsi</label>
            <select id="provinsi"><option value="">Pilih Provinsi</option></select>
        </div>
        <div class="form-group">
            <label>Kota / Kabupaten</label>
            <select id="kota"><option value="">Pilih Kota</option></select>
        </div>
        <div class="form-group">
            <label>Kecamatan</label>
            <select id="kecamatan"><option value="">Pilih Kecamatan</option></select>
        </div>
        <div class="form-group">
            <label>Desa / Kelurahan</label>
            <select id="desa"><option value="">Pilih Desa</option></select>
        </div>

        <div class="form-group">
            <label>Alamat Domisili (Jalan/RT/RW)</label>
            <textarea id="alamat" rows="2"></textarea>
        </div>

        <div class="form-group">
            <label>Wilayah Berjemaat</label>
            <select id="wilayah" onchange="updateKomsel()">
                <option value="">-- Pilih Wilayah --</option>
                <option value="Abepura">Abepura</option>
                <option value="Sentani">Sentani</option>
                <option value="Doyo">Doyo</option>
                <option value="Arso 1">Arso 1</option>
                <option value="Arso 2">Arso 2</option>
            </select>
        </div>
        <div class="form-group">
            <label>Komsel / Jemaat Cell</label>
            <select id="komsel">
                <option value="">-- Pilih Wilayah Terlebih Dahulu --</option>
            </select>
        </div>

        <div class="form-group">
            <label>Jabatan Utama</label>
            <select id="jabatan">
                <option value="Anggota Jemaat">Anggota Jemaat</option>
                <option value="Gembala Sidang">Gembala Sidang</option>
                <option value="Pemimpin / Koordinator">Pemimpin / Koordinator</option>
                <option value="PKS Komsel">PKS Komsel</option>
                <option value="Fulltimer">Fulltimer</option>
            </select>
        </div>

        <div class="form-group">
            <label>Sub Bidang Jabatan</label>
            <select id="sub_bidang" onchange="updateFungsiPelayanan()">
                <option value="Anggota Jemaat Ordinari">Anggota Jemaat Ordinari</option>
                <option value="Gembala Sidang Jemaat">Gembala Sidang Jemaat</option>
                <option value="Pdt. Pembantu">Pdt. Pembantu</option>
                <option value="Pdt. Muda">Pdt. Muda</option>
                <option value="Sekretaris Gereja">Sekretaris Gereja</option>
                <option value="Bendahara Gereja">Bendahara Gereja</option>
                <option value="Komite Gereja">Komite Gereja</option>
                <option value="Koordinator Lansia">Koordinator Lansia</option>
                <option value="Koordinator Bapak">Koordinator Bapak</option>
                <option value="Koordinator Ibu">Koordinator Ibu</option>
                <option value="Koordinator Profesi">Koordinator Profesi</option>
                <option value="Koordinator Mahasiswa">Koordinator Mahasiswa</option>
                <option value="Koordinator Pelajar">Koordinator Pelajar</option>
                <option value="Koordinator Sekolah minggu">Koordinator Sekolah minggu</option>
                <option value="Koordinator Praise & Worship">Koordinator Praise & Worship</option>
                <option value="Koordinator Tamborin, flag">Koordinator Tamborin, flag</option>
                <option value="Koordinator Multimedia">Koordinator Multimedia</option>
                <option value="Koordinator Sound Engineering & Elektrical">Koordinator Sound Engineering & Elektrical</option>
                <option value="Koordinator Pelayanan Misi">Koordinator Pelayanan Misi</option>
                <option value="Koordinator Pendoa">Koordinator Pendoa</option>
                <option value="Koordinator User">Koordinator User</option>
                <option value="Koordinator parkir dan keamanan">Koordinator parkir dan keamanan</option>
                <option value="Koordinator dekorasi dan event">Koordinator dekorasi dan event</option>
                <option value="PKS Komsel">PKS Komsel</option>
                <option value="Fulltimer Gereja">Fulltimer Gereja</option>
            </select>
        </div>

        <div class="form-group" id="fungsi_container" style="display:none;">
            <label>Fungsi Spesifik Pelayanan</label>
            <select id="fungsi_spesifik">
                <option value="">-- Pilih Fungsi --</option>
            </select>
        </div>

        <div class="form-group">
            <label>Detail Pelayanan Non-Struktural</label>
            <input type="text" id="detail_pelayanan">
        </div>

        <div class="form-group">
            <label>Status Akun</label>
            <select id="status_akun">
                <option value="Pending">Pending</option>
                <option value="Aktif">Aktif</option>
            </select>
        </div>

        <div class="form-group">
            <label>Foto Profil Jemaat</label>

            <div
                style="
                    display:flex;
                    align-items:center;
                    gap:15px;
                    flex-wrap:wrap;
                    padding:12px;
                    border:1px solid #d9e2ec;
                    border-radius:10px;
                    background:#f8fafc;
                "
            >
                <div
                    style="
                        width:110px;
                        height:135px;
                        border:1px solid #cfd8e3;
                        border-radius:8px;
                        overflow:hidden;
                        background:#eef2f6;
                        display:flex;
                        align-items:center;
                        justify-content:center;
                    "
                >
                    <img
                        id="foto_profil_preview"
                        src=""
                        alt="Preview Foto Profil"
                        style="
                            width:100%;
                            height:100%;
                            object-fit:cover;
                            display:none;
                        "
                    >

                    <i
                        id="foto_profil_placeholder"
                        class="fas fa-user"
                        style="
                            font-size:38px;
                            color:#94a3b8;
                        "
                    ></i>
                </div>

                <div style="flex:1; min-width:220px;">
                    <button
                        type="button"
                        id="foto_profil_upload_button"
                        onclick="openProfilePhotoWidget()"
                        style="
                            width:100%;
                            padding:10px 14px;
                            border:1px solid #0b4f85;
                            border-radius:8px;
                            background:#0b4f85;
                            color:#fff;
                            cursor:pointer;
                            font-weight:700;
                        "
                    >
                        <i class="fas fa-cloud-upload-alt"></i>
                        Pilih / Upload Foto Profil
                    </button>

                    <div
                        style="
                            margin-top:6px;
                            font-size:11px;
                            color:#667085;
                        "
                    >
                        Format: PNG, JPG, JPEG, WEBP.
                    </div>

                    <div
                        id="foto_profil_status"
                        style="
                            margin-top:6px;
                            font-size:12px;
                            color:#667085;
                        "
                    >
                        Pilih foto baru bila ingin mengganti foto profil.
                    </div>
                </div>
            </div>
        </div>
        <button type="submit" class="btn-save"><i class="fas fa-save"></i> Simpan Perubahan</button>
    </form>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://upload-widget.cloudinary.com/latest/global/all.js"></script>


<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDU2rk0rIF-sos_Sj7C5IMM9dU8z8p_VJM",
        authDomain: "boby-apps-project.firebaseapp.com",
        projectId: "boby-apps-project",
        storageBucket: "boby-apps-project.appspot.com",
        messagingSenderId: "125984859692",
        appId: "1:125984859692:web:09f75df5d2e4b6e3bcd389"
    };

    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.firestore();
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('edit'); 

    if (!userId) {
        alert("ID User tidak ditemukan!");
        window.location.href = 'admin.html';
    }

    let txtProv = "", txtKota = "", txtKec = "", txtDesa = "";

    async function loadProvinsi(selectedName = "") {
        const res = await fetch('https://www.emsifa.com/api-wilayah-indonesia/api/provinces.json');
        const data = await res.json();
        let options = '<option value="">Pilih Provinsi</option>';
        data.forEach(p => {
            const isSel = p.name === selectedName ? "selected" : "";
            options += `<option value="${p.id}" data-nama="${p.name}" ${isSel}>${p.name}</option>`;
        });
        document.getElementById('provinsi').innerHTML = options;
        if(selectedName) txtProv = selectedName;
    }

    async function loadKota(id, selectedName = "") {
        const res = await fetch(`https://www.emsifa.com/api-wilayah-indonesia/api/regencies/${id}.json`);
        const data = await res.json();
        let options = '<option value="">Pilih Kota</option>';
        data.forEach(p => {
            const isSel = p.name === selectedName ? "selected" : "";
            options += `<option value="${p.id}" data-nama="${p.name}" ${isSel}>${p.name}</option>`;
        });
        document.getElementById('kota').innerHTML = options;
        if(selectedName) txtKota = selectedName;
    }

    async function loadKecamatan(id, selectedName = "") {
        const res = await fetch(`https://www.emsifa.com/api-wilayah-indonesia/api/districts/${id}.json`);
        const data = await res.json();
        let options = '<option value="">Pilih Kecamatan</option>';
        data.forEach(p => {
            const isSel = p.name === selectedName ? "selected" : "";
            options += `<option value="${p.id}" data-nama="${p.name}" ${isSel}>${p.name}</option>`;
        });
        document.getElementById('kecamatan').innerHTML = options;
        if(selectedName) txtKec = selectedName;
    }

    async function loadDesa(id, selectedName = "") {
        const res = await fetch(`https://www.emsifa.com/api-wilayah-indonesia/api/villages/${id}.json`);
        const data = await res.json();
        let options = '<option value="">Pilih Desa</option>';
        data.forEach(p => {
            const isSel = p.name === selectedName ? "selected" : "";
            options += `<option value="${p.id}" data-nama="${p.name}" ${isSel}>${p.name}</option>`;
        });
        document.getElementById('desa').innerHTML = options;
        if(selectedName) txtDesa = selectedName;
    }

    // =====================================================
    // API WILAYAH KELAHIRAN
    // =====================================================

    async function loadProvinsiLahir(selectedName = "") {
        const res = await fetch(
            "https://www.emsifa.com/api-wilayah-indonesia/api/provinces.json"
        );

        const data = await res.json();

        const select =
            document.getElementById("provinsi_lahir");

        if (!select) return;

        let options =
            '<option value="">Pilih Provinsi</option>';

        data.forEach((p) => {
            const selected =
                p.name === selectedName
                    ? "selected"
                    : "";

            options += `
                <option
                    value="${p.id}"
                    data-nama="${p.name}"
                    ${selected}
                >
                    ${p.name}
                </option>
            `;
        });

        select.innerHTML = options;
    }

    async function loadKotaLahir(
        provinceId,
        selectedName = ""
    ) {
        const select =
            document.getElementById("kota_lahir");

        if (!select) return;

        select.innerHTML =
            '<option value="">Pilih Kota</option>';

        if (!provinceId) {
            return;
        }

        const res = await fetch(
            `https://www.emsifa.com/api-wilayah-indonesia/api/regencies/${provinceId}.json`
        );

        const data = await res.json();

        let options =
            '<option value="">Pilih Kota</option>';

        data.forEach((p) => {
            const selected =
                p.name === selectedName
                    ? "selected"
                    : "";

            options += `
                <option
                    value="${p.id}"
                    data-nama="${p.name}"
                    ${selected}
                >
                    ${p.name}
                </option>
            `;
        });

        select.innerHTML = options;
    }

    async function loadKecamatanLahir(
        kotaId,
        selectedName = ""
    ) {
        const select =
            document.getElementById("kecamatan_lahir");

        if (!select) return;

        select.innerHTML =
            '<option value="">Pilih Kecamatan</option>';

        if (!kotaId) {
            return;
        }

        const res = await fetch(
            `https://www.emsifa.com/api-wilayah-indonesia/api/districts/${kotaId}.json`
        );

        const data = await res.json();

        let options =
            '<option value="">Pilih Kecamatan</option>';

        data.forEach((p) => {
            const selected =
                p.name === selectedName
                    ? "selected"
                    : "";

            options += `
                <option
                    value="${p.id}"
                    data-nama="${p.name}"
                    ${selected}
                >
                    ${p.name}
                </option>
            `;
        });

        select.innerHTML = options;
    }

    async function loadDesaLahir(
        kecamatanId,
        selectedName = ""
    ) {
        const select =
            document.getElementById("desa_lahir");

        if (!select) return;

        select.innerHTML =
            '<option value="">Pilih Desa</option>';

        if (!kecamatanId) {
            return;
        }

        const res = await fetch(
            `https://www.emsifa.com/api-wilayah-indonesia/api/villages/${kecamatanId}.json`
        );

        const data = await res.json();

        let options =
            '<option value="">Pilih Desa</option>';

        data.forEach((p) => {
            const selected =
                p.name === selectedName
                    ? "selected"
                    : "";

            options += `
                <option
                    value="${p.id}"
                    data-nama="${p.name}"
                    ${selected}
                >
                    ${p.name}
                </option>
            `;
        });

        select.innerHTML = options;
    }

    document.getElementById(
        "provinsi_lahir"
    ).onchange = async function () {
        await loadKotaLahir(
            this.value
        );

        document.getElementById(
            "kecamatan_lahir"
        ).innerHTML =
            '<option value="">Pilih Kecamatan</option>';

        document.getElementById(
            "desa_lahir"
        ).innerHTML =
            '<option value="">Pilih Desa</option>';
    };

    document.getElementById(
        "kota_lahir"
    ).onchange = async function () {
        await loadKecamatanLahir(
            this.value
        );

        document.getElementById(
            "desa_lahir"
        ).innerHTML =
            '<option value="">Pilih Desa</option>';
    };

    document.getElementById(
        "kecamatan_lahir"
    ).onchange = async function () {
        await loadDesaLahir(
            this.value
        );
    };
    document.getElementById('provinsi').onchange = function() {
        txtProv = this.options[this.selectedIndex].getAttribute('data-nama');
        loadKota(this.value);
    };
    document.getElementById('kota').onchange = function() {
        txtKota = this.options[this.selectedIndex].getAttribute('data-nama');
        loadKecamatan(this.value);
    };
    document.getElementById('kecamatan').onchange = function() {
        txtKec = this.options[this.selectedIndex].getAttribute('data-nama');
        loadDesa(this.value);
    };
    document.getElementById('desa').onchange = function() {
        txtDesa = this.options[this.selectedIndex].getAttribute('data-nama');
    };

    document.getElementById('eyeIcon').addEventListener('click', function() {
        const passInput = document.getElementById('password_user');

    function renderEditChildFields(
        jumlah,
        existingChildren = []
    ) {
        const container =
            document.getElementById(
                "edit_child_fields_container"
            );

        if (!container) {
            return;
        }

        const count =
            Math.max(
                0,
                parseInt(jumlah || "0", 10) || 0
            );

        const oldChildren =
            Array.isArray(existingChildren)
                ? existingChildren
                : [];

        const oldNames =
            oldChildren.map(
                (child) =>
                    typeof child === "string"
                        ? child
                        : String(
                            child?.nama || ""
                        )
            );

        const currentInputs =
            Array.from(
                container.querySelectorAll(
                    ".edit-anak-input"
                )
            );

        currentInputs.forEach(
            (input, index) => {
                oldNames[index] =
                    input.value.trim();
            }
        );

        container.innerHTML = "";

        for (let index = 0; index < count; index++) {
            const row =
                document.createElement("div");

            row.className =
                "form-group";

            const label =
                document.createElement("label");

            label.textContent =
                `Nama Anak ${index + 1}`;

            const input =
                document.createElement("input");

            input.type = "text";
            input.className =
                "edit-anak-input";

            input.placeholder =
                `Nama lengkap anak ${index + 1}`;

            input.value =
                oldNames[index] || "";

            row.appendChild(label);
            row.appendChild(input);

            container.appendChild(row);
        }
    }

    function previewProfilePhoto(input) {
        const file =
            input?.files?.[0];

        const preview =
            document.getElementById(
                "foto_profil_preview"
            );

        const placeholder =
            document.getElementById(
                "foto_profil_placeholder"
            );

        const status =
            document.getElementById(
                "foto_profil_status"
            );

        if (
            !file ||
            !preview
        ) {
            return;
        }

        const allowedTypes = [
            "image/png",
            "image/jpeg",
            "image/webp"
        ];

        if (
            !allowedTypes.includes(
                file.type
            )
        ) {
            input.value = "";

            if (status) {
                status.textContent =
                    "Format tidak didukung. Gunakan PNG, JPG, JPEG, atau WEBP.";
                status.style.color =
                    "#b42318";
            }

            if (preview) {
                preview.removeAttribute(
                    "src"
                );
                preview.style.display =
                    "none";
            }

            if (placeholder) {
                placeholder.style.display =
                    "block";
            }

            return;
        }

        const maxSize =
            5 * 1024 * 1024;

        if (
            file.size >
            maxSize
        ) {
            input.value = "";

            if (status) {
                status.textContent =
                    "Ukuran foto maksimal 5 MB.";
                status.style.color =
                    "#b42318";
            }

            return;
        }

        const reader =
            new FileReader();

        reader.onload =
            (event) => {
                preview.src =
                    event.target.result;

                preview.style.display =
                    "block";

                if (placeholder) {
                    placeholder.style.display =
                        "none";
                }

                if (status) {
                    status.textContent =
                        `${file.name} siap diupload.`;
                    status.style.color =
                        "#027a48";
                }
            };

        reader.readAsDataURL(
            file
        );
    }
    let profilePhotoUrl = "";

    function initializeProfilePhotoWidget() {
        if (
            typeof cloudinary === "undefined"
        ) {
            console.error(
                "Cloudinary Upload Widget belum tersedia."
            );
            return;
        }

        window.__sipapuaProfilePhotoWidget =
            cloudinary.createUploadWidget(
                {
                    cloudName: "jgihr3lv",
                    uploadPreset: "sipapua_profile_jemaat",
                    multiple: false,
                    maxFiles: 1,
                    sources: [
                        "local",
                        "camera"
                    ],
                    clientAllowedFormats: [
                        "png",
                        "jpg",
                        "jpeg",
                        "webp"
                    ],
                    maxFileSize: 5242880
                },
                (
                    error,
                    result
                ) => {
                    if (error) {
                        console.error(
                            "Cloudinary Upload Widget error:",
                            error
                        );
                        return;
                    }

                    if (
                        result &&
                        result.event === "success" &&
                        result.info
                    ) {
                        profilePhotoUrl =
                            String(
                                result.info.secure_url ||
                                ""
                            ).trim();

                        if (!profilePhotoUrl) {
                            return;
                        }

                        const preview =
                            document.getElementById(
                                "foto_profil_preview"
                            );

                        const placeholder =
                            document.getElementById(
                                "foto_profil_placeholder"
                            );

                        const status =
                            document.getElementById(
                                "foto_profil_status"
                            );

                        if (preview) {
                            preview.src =
                                profilePhotoUrl;

                            preview.style.display =
                                "block";
                        }

                        if (placeholder) {
                            placeholder.style.display =
                                "none";
                        }

                        if (status) {
                            status.textContent =
                                "Foto berhasil diupload ke Cloudinary dan siap disimpan.";
                            status.style.color =
                                "#027a48";
                        }
                    }
                }
            );
    }

    function openProfilePhotoWidget() {
        if (
            !window.__sipapuaProfilePhotoWidget
        ) {
            initializeProfilePhotoWidget();
        }

        if (
            window.__sipapuaProfilePhotoWidget
        ) {
            window.__sipapuaProfilePhotoWidget.open();
        }
    }
