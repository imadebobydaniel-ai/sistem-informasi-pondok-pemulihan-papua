<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Event Jemaat - SIPAPUA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
    :root { --primary: #003366; --accent: #2ecc71; --bg: #f0f2f5; --danger: #e74c3c; }
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    input, textarea, select {
        box-sizing: border-box; width: 100% !important; max-width: 100%;
        margin-bottom: 12px; padding: 12px; border-radius: 8px;
        border: 1px solid #ddd; font-size: 16px;
    }

    .header { 
        background: var(--primary); color: white; padding: 35px 15px 15px 15px; 
        display: flex; justify-content: center; align-items: center; 
        position: sticky; top: 0; z-index: 1000; border-bottom: 3px solid var(--accent); 
    }

    .nav-left { position: absolute; left: 15px; bottom: 15px; display: flex; gap: 10px; }
    
    .nav-admin { position: absolute; right: 15px; bottom: 15px; }
    .btn-toggle-login { background: var(--accent); color: white; border: none; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }

    /* Tambahan Style Tombol Kembali */
    .btn-header-back { border:none; background:#555; color:white; height: 38px; padding:0 15px; border-radius:19px; font-weight:bold; cursor:pointer; font-size: 12px; display: flex; align-items: center; }

    .login-dropdown { 
        display: none; position: absolute; top: 50px; right: 0; width: 240px; 
        background: white; padding: 20px; border-radius: 12px; 
        box-shadow: 0 10px 30px rgba(0,0,0,0.25); z-index: 2000; border: 1px solid #eee; 
    }
    
    .login-label { text-align: center; font-size: 12px; font-weight: bold; color: var(--primary); margin-bottom: 15px; display: block; }
    .pass-container { position: relative; width: 100%; }
    .toggle-pass { position: absolute; right: 12px; top: 13px; color: #888; cursor: pointer; z-index: 10; }
    .btn-masuk-dropdown { width: 100%; height: 42px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

    .container { padding: 15px; max-width: 1000px; margin: auto; }

    #newsList { 
        display: grid; 
        grid-template-columns: repeat(auto-fit, minmax(280px, 320px)); 
        gap: 20px;
        justify-content: center;
        width: 100%;
        margin-top: 20px;
    }
    
    .news-card {
        background: white; border-radius: 12px; overflow: visible !important;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: transform 0.2s;
        cursor: pointer; display: flex; flex-direction: column;
        width: 100%; margin: 0; position: relative !important;
    }

    .news-card:hover { transform: translateY(-5px); }
    .news-img { width: 100%; height: 200px; object-fit: cover; background: #eee; border-radius: 12px 12px 0 0; }
    .news-body { padding: 15px; flex-grow: 1; position: relative; }
    .news-category { color: var(--accent); font-size: 0.75rem; font-weight: bold; text-transform: uppercase; margin-bottom: 5px; }
    .news-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 8px; color: var(--primary); line-height: 1.3; padding-right: 30px; }
    .news-meta { font-size: 0.75rem; color: #7f8c8d; display: flex; justify-content: space-between; align-items: center; margin-top: 10px; border-top: 1px solid #eee; padding-top: 10px; }

    .btn-delete-news {
        position: absolute;
        top: 15px;
        right: 15px;
        background: var(--danger);
        color: white;
        border: none;
        width: 32px;
        height: 32px;
        border-radius: 6px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    #adminSection { background: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 2px solid var(--primary); display: none; }
    #superAdminSection { background: #f9f9f9; padding: 15px; border-radius: 10px; margin-top: 15px; border: 1px dashed var(--primary); display: none; }
    .btn-action { width: 100%; padding: 14px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; color: white; font-size: 14px; }
    
    .absensi-box, .log-activity-box { background: white; border: 1px solid #ddd; border-radius: 10px; padding: 15px; margin-top: 15px; }
    .absensi-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 10px; }
    .total-counter { background: var(--primary); color: white; padding: 2px 10px; border-radius: 20px; font-size: 14px; }
    
    #reader { width: 100%; border-radius: 10px; overflow: hidden; margin: 10px 0; display: none; border: 2px dashed var(--accent); }
</style>
</head>
<body>

<div class="header">
    <div class="nav-left">
        <button id="btnMainBack" class="btn-header-back" onclick="window.history.back()">
            <i class="fas fa-chevron-left"></i> &nbsp;KEMBALI
        </button>
        <button id="btnBack" onclick="logoutEvent()" style="display:none; border:none; background:#d33; color:white; height: 38px; padding:0 20px; border-radius:19px; font-weight:bold; cursor:pointer;">LOGOUT</button>
    </div>
    <h1 style="font-size: 1.1rem; margin: 0; letter-spacing: 1px;">EVENT JEMAAT</h1>
    <div class="nav-admin">
        <button class="btn-toggle-login" onclick="toggleLoginSlider()"><i class="fas fa-user-shield"></i></button>
        <div id="loginBox" class="login-dropdown">
            <span class="login-label">LOGIN ADMIN</span>
            <input type="text" id="userAdmin" placeholder="Username">
            <div class="pass-container">
                <input type="password" id="passAdmin" placeholder="Password">
                <i class="fas fa-eye toggle-pass" id="eyeIcon" onclick="togglePassword()"></i>
          </div>
            <button class="btn-masuk-dropdown" onclick="loginEvent()">MASUK</button>
        </div>
    </div>
</div>

<div class="container">
    <div id="adminSection">
        <h3><i class="fas fa-edit"></i> CMS Input Kegiatan</h3>
        <input type="text" id="namaEvent" placeholder="Nama Kegiatan">
        <input type="text" id="lokasiEvent" placeholder="Lokasi">
        <input type="date" id="tglEvent">
        <textarea id="isiEvent" placeholder="Isi detail kegiatan..." rows="4"></textarea>
        
        <p style="font-size: 12px; margin: 0;">Upload Foto ke Cloudinary:</p>
        <input type="file" id="fotoEvent" accept="image/*" multiple capture="environment">
        <div id="uploadStatus" style="font-size: 11px; color: var(--primary); margin: 5px 0;"></div>

        <button class="btn-action" style="background:var(--accent)" id="btnSimpan">SIMPAN & SINNKRONKAN</button>

        <div class="absensi-box">
            <div class="absensi-header">
                <span style="font-weight:bold; font-size:13px;"><i class="fas fa-qrcode"></i> ABSENSI</span>
                <span class="total-counter" style="cursor:pointer" onclick="showAbsenList()">Total: <span id="totalAbsen">0</span></span>
            </div>
            <button class="btn-action" style="background: var(--primary);" onclick="startScanner()">SCAN QR</button>
            <button class="btn-action" style="background: #d33; display:none;" id="btnStopScan" onclick="stopScanner()">TUTUP KAMERA</button>
            <div id="reader"></div>
        </div>

        <div id="superAdminSection">
            <hr>
            <p style="font-weight:bold; font-size:13px; margin-bottom:10px;"><i class="fas fa-users-cog"></i> MANAJEMEN ADMIN LITE</p>
            <div style="display: flex; flex-direction: column; gap: 0px;">
                <input type="text" id="newAdminUser" placeholder="Username Baru">
                <input type="password" id="newAdminPass" placeholder="Password Baru">
                <button class="btn-action" style="background:var(--primary); margin-top:0; margin-bottom: 15px;" onclick="createNewAdmin()">DAFTARKAN ADMIN</button>
            </div>
            <div id="adminListControl" style="font-size: 11px; margin-bottom: 15px;"></div>
        </div>

        <div class="log-activity-box">
            <span style="font-weight:bold; font-size:13px;"><i class="fas fa-history"></i> LOG ACTIVITY (CLOUD)</span>
            <div id="logContent" style="margin-top:10px; font-size:11px;"></div>
        </div>
    </div>
    
    <div id="newsList"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove, get, set, child, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSy...", 
        authDomain: "boby-apps-project.firebaseapp.com",
        databaseURL: "https://boby-apps-project-default-rtdb.firebaseio.com/", 
        projectId: "boby-apps-project",
        storageBucket: "boby-apps-project.appspot.com",
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const eventRef = ref(db, 'events');
    const logRef = ref(db, 'log_activity');
    const SUPABASE_URL = "https://cfnimvrxrnmefmxtzqks.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_wgucJVERaaymia6eNj2riw_oL31966i";
const NO_IMG = "https://upload.wikimedia.org/wikipedia/commons/thumb/6/65/No-Image-Placeholder.svg/1665px-No-Image-Placeholder.svg.png";

    window.currentAdmin = localStorage.getItem('sipapua_admin') || null; 
    window.cloudinaryImages = [];
    window.currentEvents = [];

    // Konfigurasi Visibilitas Tombol Navigasi
    if (window.currentAdmin) {
        document.getElementById('adminSection').style.display = 'block';
        document.getElementById('btnBack').style.display = 'inline-block';
        document.getElementById('btnMainBack').style.display = 'none';
    } else {
        document.getElementById('btnMainBack').style.display = 'flex';
    }

    window.logoutEvent = () => {
        Swal.fire({
            title: 'Keluar?',
            text: "Apakah anda yakin akan Keluar?",
            icon: 'question',
            showCancelButton: true,
            confirmButtonColor: '#d33',
            cancelButtonColor: '#555',
            confirmButtonText: 'Ya',
            cancelButtonText: 'Tidak'
        }).then((result) => {
            if (result.isConfirmed) {
                localStorage.removeItem('sipapua_admin');
                location.reload();
            }
        });
    };

    const formatTglIndo = (dateStr) => {
        if(!dateStr) return "";
        const bulanIndo = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
        const d = new Date(dateStr);
        return `${d.getDate()} ${bulanIndo[d.getMonth()]} ${d.getFullYear()}`;
    };

    async function loadPublishedEvents() {
        const newsList = document.getElementById('newsList');
        if (!newsList) return;

        try {
            newsList.innerHTML = `
                <div style="text-align:center;padding:30px;color:#666;">
                    Memuat event jemaat...
                </div>
            `;

            const headers = {
                "apikey": SUPABASE_PUBLISHABLE_KEY,
                "Authorization": `Bearer ${SUPABASE_PUBLISHABLE_KEY}`,
                "Content-Type": "application/json"
            };

            const eventsResponse = await fetch(
                `${SUPABASE_URL}/rest/v1/published_events?select=id,nama,lokasi,tanggal,isi,published_at,wilayah,divisi,komsel,pemilik_nama&order=tanggal.desc,published_at.desc`,
                { headers }
            );

            if (!eventsResponse.ok) {
                throw new Error(`Gagal mengambil event: HTTP ${eventsResponse.status}`);
            }

            const photosResponse = await fetch(
                `${SUPABASE_URL}/rest/v1/published_event_photos?select=id,event_id,url,caption,sort_order&order=sort_order.asc`,
                { headers }
            );

            if (!photosResponse.ok) {
                throw new Error(`Gagal mengambil foto event: HTTP ${photosResponse.status}`);
            }

            const events = await eventsResponse.json();
            const photos = await photosResponse.json();

            const photoMap = {};

            photos.forEach(photo => {
                if (!photoMap[photo.event_id]) {
                    photoMap[photo.event_id] = [];
                }

                if (photo.url) {
                    photoMap[photo.event_id].push(photo.url);
                }
            });

            const list = (events || []).map(item => ({
                id: item.id,
                nama: item.nama,
                lokasi: item.lokasi,
                tgl: item.tanggal,
                isi: item.isi,
                fotos: photoMap[item.id] || [],
                createdBy: item.pemilik_nama || "PKS",
                createdAt: item.published_at,
                wilayah: item.wilayah || "",
                divisi: item.divisi || "",
                komsel: item.komsel || "",
                ownerNama: item.pemilik_nama || ""
            }));

            window.currentEvents = list;
            newsList.innerHTML = "";

            if (list.length === 0) {
                newsList.innerHTML = `
                    <div style="text-align:center;padding:40px;color:#777;">
                        Belum ada event jemaat yang dipublikasikan.
                    </div>
                `;
                return;
            }

            list.forEach(item => {
                const deleteButton = window.currentAdmin
                    ? `
                        <button class="btn-delete-news"
                            onclick="event.stopPropagation(); hapusBerita('${item.id}', '${item.createdBy || ""}')">
                            <i class="fas fa-trash"></i>
                        </button>
                    `
                    : "";

                newsList.innerHTML += `
                <div class="news-card" onclick="detailEvent('${item.id}')">
                    <img src="${(item.fotos && item.fotos[0]) || NO_IMG}" class="news-img">
                    <div class="news-body">
                        ${deleteButton}
                        <div class="news-category">OLEH: ${item.createdBy || 'PKS'}</div>
                        <div class="news-title">${item.nama || '-'}</div>
                        <div class="news-meta">
                            <span>
                                <i class="fas fa-calendar-alt"></i>
                                ${formatTglIndo(item.tgl)}
                            </span>
                        </div>
                    </div>
                </div>`;
            });

        } catch (error) {
            console.error("Supabase Event Error:", error);

            newsList.innerHTML = `
                <div style="text-align:center;padding:40px;color:#c0392b;">
                    Gagal memuat event jemaat.
                </div>
            `;
        }
    }

    loadPublishedEvents();
    window.hapusBerita = async (id, creator) => {
        const user = window.currentAdmin;
        if (!user) return Swal.fire('Akses Ditolak', 'Hanya Admin yang dapat menghapus.', 'error');
        if (user !== "SuperAdmin" && user !== creator) {
            return Swal.fire('Gagal', 'Anda hanya diizinkan menghapus berita yang Anda terbitkan sendiri.', 'error');
        }

        const { value: pass } = await Swal.fire({
            title: 'Verifikasi Password',
            text: user === "SuperAdmin" ? "SuperAdmin wajib memasukkan password untuk menghapus." : `Masukkan password untuk konfirmasi hapus.`,
            input: 'password',
            inputPlaceholder: 'Password...',
            showCancelButton: true,
            confirmButtonColor: '#e74c3c'
        });

        if (pass) {
            let isValid = false;
            if (user === "SuperAdmin" && pass === "admin123") isValid = true;
            else {
                const snap = await get(child(ref(db), `admin_users/${user}`));
                if (snap.exists() && snap.val().password === pass) isValid = true;
            }

            if (isValid) {
                remove(ref(db, `events/${id}`)).then(() => {
                    push(logRef, {
                        user: user,
                        action: `Menghapus Berita ID: ${id}`,
                        timestamp: new Date().toLocaleString()
                    });
                    Swal.fire('Berhasil', 'Berita telah dihapus.', 'success');
                });
            } else {
                Swal.fire('Gagal', 'Password salah!', 'error');
            }
        }
    };

    window.toggleLoginSlider = () => {
        const box = document.getElementById('loginBox');
        box.style.display = (box.style.display === 'block') ? 'none' : 'block';
    };

    window.togglePassword = () => {
        const p = document.getElementById('passAdmin');
        const icon = document.getElementById('eyeIcon');
        p.type = (p.type === "password") ? "text" : "password";
        icon.className = (p.type === "password") ? "fas fa-eye toggle-pass" : "fas fa-eye-slash toggle-pass";
    };

    window.loginEvent = async function() {
        const u = document.getElementById('userAdmin').value;
        const p = document.getElementById('passAdmin').value;
        let userData = null;

        if(u === "admin" && p === "admin123") {
            userData = { username: "SuperAdmin", status: "active" };
        } else {
            const snap = await get(child(ref(db), `admin_users/${u}`));
            if (snap.exists() && snap.val().password === p) {
                userData = { username: u, ...snap.val() };
            }
        }

        if (userData) {
            if(userData.status === "pending") return Swal.fire('Akses Ditolak', 'Akun ditangguhkan.', 'error');
            localStorage.setItem('sipapua_admin', userData.username);
            Swal.fire({
                title: 'Berhasil',
                text: 'Anda Berhasil Masuk',
                icon: 'success',
                timer: 1500,
                showConfirmButton: false
            }).then(() => location.reload());
        } else {
            Swal.fire('Gagal', 'Username/Password salah', 'error');
        }
    };

    window.handleFileUpload = async (event) => {
        const files = event.target.files;
        if (files.length === 0) return;
        window.cloudinaryImages = [];
        const btnSimpan = document.getElementById('btnSimpan');
        btnSimpan.disabled = true;
        Swal.fire({ title: 'Mengunggah...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
        for (let file of files) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', 'sipapua_preset'); 
            try {
                const resp = await fetch('https://api.cloudinary.com/v1_1/dxzllsbgi/image/upload', { method: 'POST', body: formData });
                const data = await resp.json();
                if (data.secure_url) window.cloudinaryImages.push(data.secure_url);
            } catch (err) { console.error(err); }
        }
        Swal.close();
        btnSimpan.disabled = false;
        document.getElementById('uploadStatus').innerText = window.cloudinaryImages.length + " Foto siap.";
    };

    window.simpanBerita = async function() {
        const nama = document.getElementById('namaEvent').value;
        const lokasi = document.getElementById('lokasiEvent').value;
        const tgl = document.getElementById('tglEvent').value;
        const isi = document.getElementById('isiEvent').value;
        if (!nama || !lokasi || !tgl) return Swal.fire('Error', 'Data wajib diisi!', 'error');

        const newEvent = { 
            nama, lokasi, tgl, isi: isi || "", 
            fotos: window.cloudinaryImages, 
            createdBy: window.currentAdmin,
            createdAt: new Date().toISOString()
        };
        await push(eventRef, newEvent);
        push(logRef, { user: window.currentAdmin, action: `Menambah Berita: ${nama}`, timestamp: new Date().toLocaleString() });
        Swal.fire('Berhasil', 'Data tersimpan!', 'success').then(() => location.reload());
    };

    // FUNGSI DETAIL EVENT TERBARU (TANPA WA & PDF)
    window.detailEvent = (id) => {
        const item = window.currentEvents.find(x => x.id === id);
        const gallery = (item.fotos || []).map(f => `<img src="${f}" style="width:100%; border-radius:8px; margin-bottom:10px;">`).join('') || `<img src="${NO_IMG}" style="width:100%;">`;
        
        Swal.fire({
            title: item.nama,
            html: `<div style="max-height:350px; overflow-y:auto">${gallery}</div>
                    <div style="text-align:left; font-size:14px; margin-top:15px">
                        <p><b>ðŸ“ Lokasi:</b> ${item.lokasi}</p>
                        <p><b>ðŸ“… Tanggal:</b> ${formatTglIndo(item.tgl)}</p>
                        <hr><div style="white-space:pre-line">${item.isi}</div>
                    </div>`,
            showConfirmButton: false, 
            showCloseButton: true, 
            width: '90%'
        });
    };

    // Listener Log Activity Realtime
    onValue(logRef, (snap) => {
        const data = snap.val(); let h = "";
        const logArr = [];
        for(let id in data) { logArr.unshift(data[id]); }
        logArr.slice(0, 20).forEach(l => {
            h += `<div style="border-bottom:1px solid #eee; padding:3px 0;">> ${l.timestamp} - <b>${l.user}</b>: ${l.action}</div>`;
        });
        const logContent = document.getElementById('logContent');
        if(logContent) logContent.innerHTML = h;
    });

    document.getElementById('fotoEvent').onchange = window.handleFileUpload;
    document.getElementById('btnSimpan').onclick = window.simpanBerita;
</script></body>
</html>
