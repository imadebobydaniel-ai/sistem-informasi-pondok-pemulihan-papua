<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Statistik — Dalam Pengerjaan</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: 16px;
      display: grid;
      place-items: center;
      background: #f5f7fa;
    }
    main { width: 100%; display: grid; place-items: center; }
    img {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <main>
    <img src="statistik-dalam-pengerjaan.webp" alt="Statistik sedang dalam pengerjaan">
  </main>
</body>
</html>
