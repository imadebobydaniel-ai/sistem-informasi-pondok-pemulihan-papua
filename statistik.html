<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Statistik — Dalam Pengerjaan</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: 16px;
      display: grid;
      place-items: center;
      background: #f5f7fa;
    }
    main { width: 100%; display: grid; place-items: center; }
    img {
  display: block;
  width: auto;
  height: auto;
  max-width: 100%;
  max-height: calc(100dvh - 32px); /* muat dalam tinggi layar (dikurangi padding 16px atas-bawah) */
  aspect-ratio: 9 / 16;
  object-fit: contain;
  border-radius: 16px;              /* opsional, sudut membulat seperti layar HP */
}
  </style>
</head>
<body>
  <main>
    <img src="statistik-tiktok-540x960.webp" alt="Statistik sedang dalam pengerjaan">
  </main>
</body>
</html>
