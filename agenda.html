<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agenda Tahunan - Pondok Pemulihan Papua</title>
    <style>
        /* CSS PREMIUM & MOBILE OPTIMIZED */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        
        :root {
            --primary-color: #006666;
            --secondary-color: #d4af37;
            --bg-light: #f4f7f6;
            --text-dark: #2c3e50;
            --white: #ffffff;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: var(--bg-light); 
            color: var(--text-dark); 
            margin: 0; 
            padding: 15px;
            overflow-x: hidden;
        }

        .container { 
            max-width: 1100px; 
            margin: 20px auto; 
            background: var(--white); 
            padding: 25px; 
            border-radius: 20px; 
            box-shadow: var(--shadow); 
            border-top: 5px solid var(--primary-color); 
        }

        .btn-back { 
            display: inline-flex; 
            align-items: center; 
            text-decoration: none; 
            color: var(--primary-color); 
            font-weight: 600; 
            margin-bottom: 25px; 
            font-size: 14px;
            transition: 0.3s; 
        }

        .logo-wrapper {
            text-align: center;
            margin-bottom: 10px;
        }

        .logo-wrapper img {
            max-height: 80px; 
            width: auto; 
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.1));
        }

        h2 { 
            color: var(--primary-color); 
            text-align: center; 
            font-weight: 700; 
            margin-bottom: 30px; 
            text-transform: uppercase; 
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        .filter-section { 
            display: flex; 
            flex-direction: column;
            gap: 12px; 
            background: #eef2f1; 
            padding: 15px; 
            border-radius: 15px; 
            margin-bottom: 30px; 
        }

        select, .btn-cari { 
            width: 100%;
            padding: 14px; 
            border-radius: 10px; 
            font-size: 14px;
            font-weight: 600;
        }

        select {
            border: 2px solid #ddd;
            background: var(--white);
            color: var(--text-dark);
            outline: none;
        }

        .btn-cari {
            background: var(--primary-color); 
            color: var(--white); 
            border: none; 
            cursor: pointer;
            transition: background 0.3s;
        }

        .tabs-cluster { 
            display: flex; 
            justify-content: flex-start; 
            gap: 10px; 
            margin-bottom: 25px; 
            overflow-x: auto;
            padding-bottom: 10px;
            -webkit-overflow-scrolling: touch;
        }

        .tabs-cluster::-webkit-scrollbar { display: none; }

        .tab-link { 
            white-space: nowrap;
            padding: 10px 20px; 
            border: 2px solid var(--primary-color); 
            background: transparent; 
            color: var(--primary-color); 
            border-radius: 50px; 
            font-weight: 600; 
            font-size: 13px;
        }

        .tab-link.active { 
            background: var(--primary-color); 
            color: var(--white); 
        }

        .sub-tab-wrapper { 
            display: flex; 
            justify-content: flex-start; 
            gap: 8px; 
            overflow-x: auto;
            margin-bottom: 20px; 
            padding: 12px; 
            background: #f9f9f9; 
            border-radius: 12px;
            -webkit-overflow-scrolling: touch;
        }

        .sub-tab-wrapper::-webkit-scrollbar { display: none; }

        .sub-link { 
            white-space: nowrap;
            padding: 8px 16px; 
            border: 1px solid #ddd; 
            background: var(--white); 
            color: #666; 
            border-radius: 8px; 
            font-size: 12px; 
            font-weight: 500;
        }

        .sub-link.active { 
            background: var(--primary-color) !important; 
            color: var(--white) !important; 
            border-color: var(--primary-color);
        }

        .agenda-list { 
            min-height: 180px; 
            padding: 20px; 
            background: #ffffff; 
            border: 2px dashed #e0e0e0; 
            border-radius: 15px; 
            display: block; 
            text-align: left;
        }

        .agenda-item {
            background: #fff;
            border-left: 4px solid var(--primary-color);
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border-radius: 8px;
            position: relative;
        }
        .agenda-item h4 { margin: 0 0 5px 0; color: var(--primary-color); padding-right: 70px; }
        .agenda-item p { margin: 2px 0; font-size: 13px; color: #555; }

        .cluster-content { display: none; }
        .cluster-content.active { display: block; animation: fadeIn 0.3s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (min-width: 768px) {
            .filter-section { flex-direction: row; }
            .tabs-cluster, .sub-tab-wrapper { justify-content: center; overflow-x: visible; }
            h2 { font-size: 1.5rem; }
            .logo-wrapper img { max-height: 110px; }
            .container { padding: 40px; margin: 40px auto; }
        }
    </style>
</head>
<body>

<div class="container">
    <a href="menu.html" class="btn-back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Kembali
    </a>

    <div class="logo-wrapper">
        <img src="logo_pondok.png" alt="Logo Pondok Pemulihan Papua">
    </div>

    <h2>AGENDA TAHUNAN JEMAAT</h2>

    <div class="filter-section">
        <select id="selectBulan">
            <option value="">Pilih Bulan</option>
            <option value="1">Januari</option><option value="2">Februari</option><option value="3">Maret</option>
            <option value="4">April</option><option value="5">Mei</option><option value="6">Juni</option>
            <option value="7">Juli</option><option value="8">Agustus</option><option value="9">September</option>
            <option value="10">Oktober</option><option value="11">November</option><option value="12">Desember</option>
        </select>
        <select id="selectTahun"></select>
        <button class="btn-cari" onclick="cariAgenda()">Cari Agenda</button>
    </div>

    <div class="tabs-cluster">
        <button class="tab-link active" onclick="openCluster(event, 'Abepura')">Abepura</button>
        <button class="tab-link" onclick="openCluster(event, 'Sentani')">Sentani</button>
        <button class="tab-link" onclick="openCluster(event, 'Doyo')">Doyo</button>
        <button class="tab-link" onclick="openCluster(event, 'Arso1')">Arso 1</button>
        <button class="tab-link" onclick="openCluster(event, 'Arso2')">Arso 2</button>
        <button class="tab-link" style="border-color: #d4af37; color: #d4af37;" onclick="openCluster(event, 'AllGereja')">All Gereja</button>
    </div>

    <div id="Abepura" class="cluster-content active"></div>
    <div id="Sentani" class="cluster-content"></div>
    <div id="Doyo" class="cluster-content"></div>
    <div id="Arso1" class="cluster-content"></div>
    <div id="Arso2" class="cluster-content"></div>
    <div id="AllGereja" class="cluster-content"></div>
</div>

<script>
    const SUPABASE_URL = "https://cfnimvrxrnmefmxtzqks.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_wgucJVERaaymia6eNj2riw_oL31966i";

    const MONTHS = [
        "",
        "Januari",
        "Februari",
        "Maret",
        "April",
        "Mei",
        "Juni",
        "Juli",
        "Agustus",
        "September",
        "Oktober",
        "November",
        "Desember"
    ];

    const selectTahun = document.getElementById("selectTahun");
    const thnSekarang = new Date().getFullYear();

    for (let i = thnSekarang - 1; i <= 2035; i++) {
        const opt = document.createElement("option");
        opt.value = String(i);
        opt.textContent = String(i);

        if (i === thnSekarang) {
            opt.selected = true;
        }

        selectTahun.appendChild(opt);
    }

    const clusters = ["Abepura", "Sentani", "Doyo", "Arso1", "Arso2", "AllGereja"];

    const headers = {
        "apikey": SUPABASE_PUBLISHABLE_KEY,
        "Authorization": "Bearer " + SUPABASE_PUBLISHABLE_KEY,
        "Content-Type": "application/json"
    };

    const escapeHtml = (value) =>
        String(value ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");

    clusters.forEach((id) => {
        const div = document.getElementById(id);

        if (!div) return;

        div.innerHTML = `
            <div class="sub-tab-wrapper">
                <button class="sub-link active">
                    Semua Divisi / Tim
                </button>
            </div>

            <div class="agenda-list">
                <p style="color:#888;text-align:center;width:100%;">
                    Silakan pilih bulan dan klik "Cari Agenda" untuk melihat jadwal.
                </p>
            </div>
        `;
    });

    function openCluster(evt, clusterName) {
        document.querySelectorAll(".cluster-content").forEach((c) => {
            c.style.display = "none";
            c.classList.remove("active");
        });

        document.querySelectorAll(".tab-link").forEach((t) => {
            t.classList.remove("active");
        });

        const target = document.getElementById(clusterName);

        if (!target) return;

        target.style.display = "block";

        setTimeout(() => {
            target.classList.add("active");
        }, 10);

        evt.currentTarget.classList.add("active");

        cariAgenda();
    }

    async function loadAgendaRows(bln, thn, wilayahAktif) {
        const bulanNama = MONTHS[Number(bln)];

        if (!bulanNama) return [];

        const params = new URLSearchParams();

        params.set(
            "select",
            [
                "id",
                "wilayah",
                "divisi",
                "tahun",
                "periode",
                "bulan",
                "program_kerja",
                "tujuan_pelaksanaan",
                "sasaran_target",
                "estimasi_pencapaian",
                "minggu_i",
                "minggu_ii",
                "minggu_iii",
                "minggu_iv",
                "keterangan",
                "kendala_pelaksanaan",
                "tindak_lanjut"
            ].join(",")
        );

        params.set("tahun", "eq." + thn);
        params.set("bulan", "eq." + bulanNama);

        if (wilayahAktif !== "All Gereja") {
            params.set("wilayah", "eq." + wilayahAktif);
        }

        params.set("order", "created_at.desc");

        const response = await fetch(
            SUPABASE_URL +
            "/rest/v1/published_agenda_programs?" +
            params.toString(),
            { headers }
        );

        if (!response.ok) {
            const message = await response.text();
            throw new Error(
                message || "Gagal mengambil data Agenda Supabase."
            );
        }

        return await response.json();
    }

    async function loadAnnualActivityRows(bln, thn, wilayahAktif) {
        const monthNumber = Number(bln);
        const yearNumber = Number(thn);

        if (!monthNumber || !yearNumber) return [];

        const startDate =
            yearNumber +
            "-" +
            String(monthNumber).padStart(2, "0") +
            "-01";

        const nextMonth = new Date(
            Date.UTC(yearNumber, monthNumber, 1)
        );

        const endDate =
            nextMonth.getUTCFullYear() +
            "-" +
            String(nextMonth.getUTCMonth() + 1).padStart(2, "0") +
            "-01";

        const params = new URLSearchParams();

        params.set(
            "select",
            "id,wilayah,divisi,nama_kegiatan,tanggal_kegiatan,tahun_kegiatan,lokasi_kegiatan,agenda_kegiatan,keterangan,pemilik_nama"
        );

        params.set(
            "tanggal_kegiatan",
            "gte." + startDate
        );

        params.append(
            "tanggal_kegiatan",
            "lt." + endDate
        );

        if (wilayahAktif !== "All Gereja") {
            params.set(
                "wilayah",
                "eq." + wilayahAktif
            );
        }

        params.set(
            "order",
            "tanggal_kegiatan.asc,created_at.asc"
        );

        const response = await fetch(
            SUPABASE_URL +
                "/rest/v1/published_annual_activities?" +
                params.toString(),
            {
                headers
            }
        );

        if (!response.ok) {
            throw new Error(
                await response.text() ||
                "Gagal mengambil Kegiatan Tahunan."
            );
        }

        return await response.json();
    }

    async function loadAnnualActivityPhotos(activityIds) {
        if (!activityIds.length) return [];

        const params = new URLSearchParams();

        params.set(
            "select",
            "id,activity_id,url,caption,sort_order"
        );

        params.set(
            "activity_id",
            "in.(" + activityIds.join(",") + ")"
        );

        params.set("order", "sort_order.asc");

        const response = await fetch(
            SUPABASE_URL +
                "/rest/v1/published_annual_activity_photos?" +
                params.toString(),
            {
                headers
            }
        );

        if (!response.ok) return [];

        return await response.json();
    }

    async function renderAnnualActivities(
        listArea,
        bln,
        thn,
        wilayahAktif
    ) {
        try {
            const rows = await loadAnnualActivityRows(
                bln,
                thn,
                wilayahAktif
            );

            if (!rows.length) return;

            const photos = await loadAnnualActivityPhotos(
                rows.map((row) => row.id)
            );

            const photosByActivity = new Map();

            photos.forEach((photo) => {
                const current =
                    photosByActivity.get(photo.activity_id) || [];

                current.push(photo);

                photosByActivity.set(
                    photo.activity_id,
                    current
                );
            });

            let html = `
                <div style="
                    margin-top:20px;
                    padding-top:18px;
                    border-top:2px solid #e0e0e0;
                ">
                    <h3 style="
                        margin:0 0 15px;
                        color:#006666;
                        font-size:18px;
                    ">
                        Kegiatan Tahunan
                    </h3>
            `;

            rows.forEach((data) => {
                const rowPhotos =
                    photosByActivity.get(data.id) || [];

                const parts =
                    String(data.tanggal_kegiatan || "").split("-");

                const tanggal =
                    parts.length === 3
                        ? parts[2] + "-" + parts[1] + "-" + parts[0]
                        : data.tanggal_kegiatan || "-";

                const photoHtml = rowPhotos.length
                    ? `
                        <div style="
                            display:grid;
                            grid-template-columns:
                                repeat(auto-fit,minmax(140px,1fr));
                            gap:10px;
                            margin-top:14px;
                        ">
                            ${rowPhotos.map((photo) => `
                                <figure style="margin:0;">
                                    <img
                                        src="${escapeHtml(photo.url)}"
                                        alt="${escapeHtml(
                                            photo.caption ||
                                            "Dokumentasi Kegiatan Tahunan"
                                        )}"
                                        loading="lazy"
                                        style="
                                            width:100%;
                                            height:160px;
                                            object-fit:cover;
                                            border-radius:10px;
                                            border:1px solid #e5e7e5;
                                        "
                                    >
                                </figure>
                            `).join("")}
                        </div>
                    `
                    : "";

                html += `
                    <div class="agenda-item">
                        <h4>
                            ${escapeHtml(
                                data.nama_kegiatan ||
                                "Kegiatan Tahunan"
                            )}
                        </h4>

                        <p>
                            <b>Wilayah:</b>
                            ${escapeHtml(data.wilayah || "-")}
                        </p>

                        <p>
                            <b>Divisi / Tim:</b>
                            ${escapeHtml(data.divisi || "-")}
                        </p>

                        <p>
                            <b>Tanggal:</b>
                            ${escapeHtml(tanggal)}
                        </p>

                        <p>
                            <b>Tahun:</b>
                            ${escapeHtml(data.tahun_kegiatan || "-")}
                        </p>

                        <p>
                            <b>Lokasi:</b>
                            ${escapeHtml(data.lokasi_kegiatan || "-")}
                        </p>

                        <p>
                            <b>Agenda Kegiatan:</b>
                            ${escapeHtml(data.agenda_kegiatan || "-")}
                        </p>

                        <p>
                            <b>Keterangan:</b>
                            ${escapeHtml(data.keterangan || "-")}
                        </p>

                        ${
                            data.pemilik_nama
                                ? `
                                    <p>
                                        <b>Pemilik:</b>
                                        ${escapeHtml(data.pemilik_nama)}
                                    </p>
                                `
                                : ""
                        }

                        ${photoHtml}
                    </div>
                `;
            });

            html += "</div>";

            const existingAnnualSection = listArea.querySelector(
                '[data-section="annual-activities"]'
            );

            if (existingAnnualSection) {
                existingAnnualSection.remove();
            }

            const annualWrapper = document.createElement("div");
            annualWrapper.setAttribute(
                "data-section",
                "annual-activities"
            );
            annualWrapper.innerHTML = html;

            listArea.appendChild(annualWrapper);
        } catch (error) {
            console.error(
                "Supabase Kegiatan Tahunan Error:",
                error
            );
        }
    }
    async function loadAgendaPhotos(agendaIds) {
        if (!agendaIds.length) return [];

        const params = new URLSearchParams();

        params.set(
            "select",
            "id,agenda_id,url,caption,sort_order"
        );

        params.set(
            "agenda_id",
            "in.(" + agendaIds.join(",") + ")"
        );

        params.set("order", "sort_order.asc");

        const response = await fetch(
            SUPABASE_URL +
            "/rest/v1/published_agenda_program_photos?" +
            params.toString(),
            { headers }
        );

        if (!response.ok) return [];

        return await response.json();
    }

    async function cariAgenda() {
        const bln = document.getElementById("selectBulan").value;
        const thn = document.getElementById("selectTahun").value;

        const tabAktif = document.querySelector(".tab-link.active");

        if (!tabAktif) return;

        const wilayahAktif = tabAktif.innerText.trim();
        const containerId = wilayahAktif.replace(/\s/g, "");
        const containerAktif = document.getElementById(containerId);

        if (!containerAktif) return;

        const listArea = containerAktif.querySelector(".agenda-list");

        if (!bln) {
            listArea.innerHTML = `
                <p style="color:#e67e22;text-align:center;width:100%;">
                    Harap pilih bulan terlebih dahulu.
                </p>
            `;
            return;
        }

        listArea.innerHTML = `
            <p style="color:#006666;text-align:center;width:100%;">
                Memuat data agenda...
            </p>
        `;

        try {
            const rows = await loadAgendaRows(
                bln,
                thn,
                wilayahAktif
            );

            if (!rows.length) {
                listArea.innerHTML = `
                    <p style="color:#888;text-align:center;width:100%;">
                        Agenda Terprogram untuk <b>${escapeHtml(wilayahAktif)}</b>
                        bulan <b>${escapeHtml(MONTHS[Number(bln)])}</b>
                        tahun <b>${escapeHtml(thn)}</b>
                        belum tersedia.
                    </p>
                `;

                await renderAnnualActivities(
                    listArea,
                    bln,
                    thn,
                    wilayahAktif
                );

                return;
            }

            const photos = await loadAgendaPhotos(
                rows.map((row) => row.id)
            );

            const photosByAgenda = new Map();

            photos.forEach((photo) => {
                const current =
                    photosByAgenda.get(photo.agenda_id) || [];

                current.push(photo);
                photosByAgenda.set(photo.agenda_id, current);
            });

            let htmlResult = "";

            rows.forEach((data) => {
                const rowPhotos =
                    photosByAgenda.get(data.id) || [];

                const labelWilayah =
                    wilayahAktif === "All Gereja"
                        ? `
                            <small style="
                                background:#eef2f1;
                                color:#006666;
                                padding:4px 8px;
                                border-radius:6px;
                                position:absolute;
                                right:15px;
                                top:15px;
                                font-weight:bold;
                                border:1px solid #006666;
                            ">
                                ${escapeHtml(data.wilayah)}
                            </small>
                        `
                        : "";

                const photoHtml = rowPhotos.length
                    ? `
                        <div style="
                            display:grid;
                            grid-template-columns:
                                repeat(auto-fit,minmax(140px,1fr));
                            gap:10px;
                            margin-top:14px;
                        ">
                            ${rowPhotos.map((photo) => `
                                <figure style="margin:0;">
                                    <img
                                        src="${escapeHtml(photo.url)}"
                                        alt="${escapeHtml(
                                            photo.caption ||
                                            "Dokumentasi Agenda"
                                        )}"
                                        loading="lazy"
                                        style="
                                            width:100%;
                                            height:160px;
                                            object-fit:cover;
                                            border-radius:10px;
                                            border:1px solid #e5e7e5;
                                        "
                                    >
                                    ${
                                        photo.caption
                                            ? `
                                                <figcaption style="
                                                    font-size:11px;
                                                    color:#777;
                                                    margin-top:4px;
                                                ">
                                                    ${escapeHtml(
                                                        photo.caption
                                                    )}
                                                </figcaption>
                                            `
                                            : ""
                                    }
                                </figure>
                            `).join("")}
                        </div>
                    `
                    : "";

                htmlResult += `
                    <div class="agenda-item">
                        ${labelWilayah}

                        <h4>
                            ${escapeHtml(
                                data.program_kerja ||
                                "Program Kerja"
                            )}
                        </h4>

                        <p>
                            <b>Wilayah:</b>
                            ${escapeHtml(data.wilayah || "-")}
                        </p>

                        <p>
                            <b>Divisi / Tim:</b>
                            ${escapeHtml(data.divisi || "-")}
                        </p>

                        <p>
                            <b>Tahun:</b> ${escapeHtml(data.tahun || "-")}
                            &nbsp; | &nbsp;
                            <b>Periode:</b>
                            ${escapeHtml(data.periode || "-")}
                            &nbsp; | &nbsp;
                            <b>Bulan:</b>
                            ${escapeHtml(data.bulan || "-")}
                        </p>

                        <p>
                            <b>Tujuan Pelaksanaan:</b>
                            ${escapeHtml(
                                data.tujuan_pelaksanaan || "-"
                            )}
                        </p>

                        <p>
                            <b>Sasaran / Target:</b>
                            ${escapeHtml(
                                data.sasaran_target || "-"
                            )}
                        </p>

                        <p>
                            <b>Estimasi Pencapaian:</b>
                            ${escapeHtml(
                                data.estimasi_pencapaian || "-"
                            )}
                        </p>

                        <p>
                            <b>Minggu I:</b>
                            ${escapeHtml(data.minggu_i || "-")}
                        </p>

                        <p>
                            <b>Minggu II:</b>
                            ${escapeHtml(data.minggu_ii || "-")}
                        </p>

                        <p>
                            <b>Minggu III:</b>
                            ${escapeHtml(data.minggu_iii || "-")}
                        </p>

                        <p>
                            <b>Minggu IV:</b>
                            ${escapeHtml(data.minggu_iv || "-")}
                        </p>

                        <p>
                            <b>Keterangan:</b>
                            ${escapeHtml(data.keterangan || "-")}
                        </p>

                        <p>
                            <b>Kendala Pelaksanaan:</b>
                            ${escapeHtml(
                                data.kendala_pelaksanaan || "-"
                            )}
                        </p>

                        <p>
                            <b>Tindak Lanjut:</b>
                            ${escapeHtml(
                                data.tindak_lanjut || "-"
                            )}
                        </p>

                        ${photoHtml}
                    </div>
                `;
            });

            listArea.innerHTML = htmlResult;

            await renderAnnualActivities(
                listArea,
                bln,
                thn,
                wilayahAktif
            );
        } catch (error) {
            console.error(
                "Supabase Agenda Error:",
                error
            );

            listArea.innerHTML = `
                <p style="
                    color:#c0392b;
                    text-align:center;
                    width:100%;
                ">
                    Terjadi kesalahan saat memuat Agenda.
                </p>
            `;
        }
    }
</script>
